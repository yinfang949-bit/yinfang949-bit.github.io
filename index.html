<!DOCTYPE html>
<html lang="zh-CN" data-theme="reset">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F6F1E8">
<title>春暖花开</title>
<style>
/* ============================================================================
   Layer 1 · 设计令牌（多主题 + 玻璃桥接）
   ============================================================================ */
:root,
[data-theme="reset"] {
  --pageBg:#F6F1E8; --cardBg:#EFE8DC; --inputBg:#E7DECF; --hoverBg:#DFD4C1;
  --emphasis:#E4DAC8; --divider:#DFD4C1;
  --accent:#B4552B; --accentDark:#9E471F; --accentPressed:#853A17;
  --accent-rgb:180,85,43;
  --textPrimary:#262117; --textSecondary:#5D5545; --textHint:#9C937F;
  --btnText:#FFFFFF;
  --lg-pri-rgb:180,85,43; --lg-bg-rgb:246,241,232;

  color-scheme: light;
}
[data-theme="reset-dark"] {
  --pageBg:#171310; --cardBg:#1F1A15; --inputBg:#262019; --hoverBg:#2E261D;
  --emphasis:#241E17; --divider:#3A3022;
  --accent:#D98A4E; --accentDark:#C8783B; --accentPressed:#B4672C;
  --accent-rgb:217,138,78;
  --textPrimary:#F4EDE2; --textSecondary:#C9BCA6; --textHint:#8F8371;
  --btnText:#171310;
  --lg-pri-rgb:217,138,78; --lg-bg-rgb:23,19,16;
}
[data-theme="reset-navy"] {
  --pageBg:#F5EFEA; --cardBg:#EDE6DF; --inputBg:#E5DDD5; --hoverBg:#DDD4CB;
  --emphasis:#E8DFD6; --divider:#DDD4CB;
  --accent:#122E8A; --accentDark:#0E2470; --accentPressed:#0A1C58;
  --accent-rgb:18,46,138;
  --textPrimary:#122E8A; --textSecondary:#3E5299; --textHint:#7E8AB8;
  --btnText:#F5EFEA;
  --lg-pri-rgb:18,46,138; --lg-bg-rgb:245,239,234;
}
[data-theme="purple"] {
  --pageBg:#F0EBF5; --cardBg:#E0D4F0; --inputBg:#D8C9EB; --hoverBg:#D0BEF0;
  --emphasis:#D5C8E8; --divider:#D0BEF0;
  --accent:#9B7FD0; --accentDark:#8A6EC0; --accentPressed:#7A5EB0;
  --accent-rgb:155,127,208;
  --textPrimary:#3D2855; --textSecondary:#6A5080; --textHint:#A890C0;
  --btnText:#FFFFFF;
  --lg-pri-rgb:155,127,208; --lg-bg-rgb:240,235,245;
}
[data-theme="green"] {
  --pageBg:#EBF5F1; --cardBg:#D4F0E2; --inputBg:#C9EBDA; --hoverBg:#BEF0D4;
  --emphasis:#C8E8D7; --divider:#BEF0D4;
  --accent:#7FD0A1; --accentDark:#6EC090; --accentPressed:#5EB080;
  --accent-rgb:127,208,161;
  --textPrimary:#285540; --textSecondary:#50806D; --textHint:#90C0AB;
  --btnText:#FFFFFF;
  --lg-pri-rgb:127,208,161; --lg-bg-rgb:235,245,241;
}
[data-theme="blue"] {
  --pageBg:#EBEEF5; --cardBg:#D4DFF0; --inputBg:#C9D6EB; --hoverBg:#BED5F0;
  --emphasis:#C8D5E8; --divider:#BED5F0;
  --accent:#7FA5D0; --accentDark:#6E95C0; --accentPressed:#5E85B0;
  --accent-rgb:127,165,208;
  --textPrimary:#283855; --textSecondary:#505D80; --textHint:#909FC0;
  --btnText:#FFFFFF;
  --lg-pri-rgb:127,165,208; --lg-bg-rgb:235,238,245;
}
[data-theme="bw"] {
  --pageBg:#F0F0F0; --cardBg:#E2E2E2; --inputBg:#DADADA; --hoverBg:#D7D7D7;
  --emphasis:#D8D8D8; --divider:#D7D7D7;
  --accent:#212121; --accentDark:#000000; --accentPressed:#333333;
  --accent-rgb:33,33,33;
  --textPrimary:#3E3E3E; --textSecondary:#686868; --textHint:#A8A8A8;
  --btnText:#FFFFFF;
  --lg-pri-rgb:33,33,33; --lg-bg-rgb:240,240,240;
}

/* 通用衍生令牌 */
:root {
  --sidebar-bg: var(--cardBg);
  --avatar-ring: var(--cardBg);
  --card-shadow: 0 1px 2px rgba(38,33,23,.04), 0 10px 30px rgba(38,33,23,.06);
  --card-shadow-hover: 0 1px 2px rgba(38,33,23,.05), 0 16px 36px rgba(38,33,23,.11);

  --lg-blur: 18px;
  --lg-blur-strong: 20px;
  --lg-alpha: 0.22;
  --lg-border: rgba(255,255,255,.45);
  --lg-inset: inset 0 1px 2px rgba(255,255,255,.45);
  --lg-shadow: 0 8px 32px rgba(31,27,46,.13);
  --lg-soft: 0 4px 18px rgba(31,27,46,.08);
}
[data-theme$="-dark"] {
  color-scheme: dark;
  --card-shadow: 0 1px 2px rgba(0,0,0,.30), 0 12px 32px rgba(0,0,0,.28);
  --card-shadow-hover: 0 1px 2px rgba(0,0,0,.34), 0 18px 40px rgba(0,0,0,.40);
  --lg-border: rgba(255,255,255,.12);
  --lg-inset: inset 0 1px 2px rgba(255,255,255,.05);
  --lg-shadow: 0 8px 32px rgba(0,0,0,.42);
  --lg-soft: 0 4px 18px rgba(0,0,0,.34);
}

/* ============================================================================
   Layer 2 · 桥接令牌
   ============================================================================ */
:root {
  --radius-sm: 8px;
  --radius-md: 14px;
  --radius-lg: 20px;
  --radius-pill: 9999px;

  --sidebar-w: 260px;
  --sidebar-w-collapsed: 76px;

  --sp-1: 4px;  --sp-2: 8px;  --sp-3: 12px;
  --sp-4: 16px; --sp-5: 24px; --sp-6: 32px; --sp-7: 48px;

  --fs-h1: 34px;
  --fs-body: 16px;
  --fs-sub: 14px;
  --fs-small: 13px;
  --fs-tiny: 11px;

  --ease-out: cubic-bezier(0.23, 1, 0.32, 1);
  --dur: 200ms;
  --dur-fast: 140ms;
  --dur-slide: 450ms;
}

/* ============================================================================
   Layer 3 · 重置
   ============================================================================ */
*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

html {
  -webkit-text-size-adjust: 100%;
  -webkit-tap-highlight-color: transparent;
  -webkit-font-smoothing: antialiased;
  overscroll-behavior: none;
  scroll-behavior: smooth;
}

body {
  min-height: 100vh;
  min-height: 100dvh;
  color: var(--textPrimary);
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
               "Noto Sans SC", "PingFang SC", "Microsoft YaHei", sans-serif;
  font-size: var(--fs-body);
  line-height: 1.7;
  overflow-x: hidden;
  background:
    radial-gradient(50% 40% at 88% -8%, rgba(var(--accent-rgb), .10), transparent 62%),
    radial-gradient(44% 36% at 0% 104%, rgba(var(--accent-rgb), .06), transparent 62%),
    var(--pageBg);
  background-attachment: fixed;
  transition: background-color var(--dur) var(--ease-out),
              color var(--dur) var(--ease-out);
}
body.lg-enable {
  background:
    radial-gradient(58% 42% at 12% 8%, rgba(var(--lg-pri-rgb), .34), transparent 62%),
    radial-gradient(52% 40% at 88% 12%, rgba(var(--lg-pri-rgb), .16), transparent 62%),
    radial-gradient(66% 52% at 80% 92%, rgba(var(--lg-pri-rgb), .22), transparent 66%),
    linear-gradient(160deg, var(--pageBg) 0%, var(--pageBg) 52%, #FFFFFF 100%);
  background-size: 240% 240%, 240% 240%, 240% 240%, 100% 100%;
  background-attachment: fixed;
}
[data-theme$="-dark"] body.lg-enable {
  background:
    radial-gradient(58% 42% at 12% 8%, rgba(var(--lg-pri-rgb), .22), transparent 62%),
    radial-gradient(52% 40% at 88% 12%, rgba(var(--lg-pri-rgb), .12), transparent 62%),
    radial-gradient(66% 52% at 80% 92%, rgba(var(--lg-pri-rgb), .16), transparent 66%),
    linear-gradient(160deg, var(--pageBg) 0%, var(--cardBg) 55%, var(--pageBg) 100%);
  background-size: 240% 240%, 240% 240%, 240% 240%, 100% 100%;
  background-attachment: fixed;
}

a { color: inherit; text-decoration: none; }
img { display: block; max-width: 100%; }

button, a, select {
  touch-action: manipulation;
  -webkit-user-select: none;
  user-select: none;
  font-family: inherit;
  color: inherit;
}

::selection { background: rgba(var(--accent-rgb), .22); }

::-webkit-scrollbar { width: 6px; height: 6px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb {
  background: rgba(var(--accent-rgb), .32);
  border-radius: 999px;
}
::-webkit-scrollbar-thumb:hover { background: rgba(var(--accent-rgb), .55); }

:focus-visible {
  outline: 2px solid var(--accent);
  outline-offset: 2px;
  border-radius: var(--radius-sm);
}

/* ============================================================================
   Layer 4 · 骨架
   ============================================================================ */
.layout {
  display: flex;
  min-height: 100vh;
  min-height: 100dvh;
}

/* 小屏遮罩 */
.sb-backdrop {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,.38);
  z-index: 150;
  opacity: 0;
  pointer-events: none;
  transition: opacity 300ms var(--ease-out);
}
.sb-backdrop.visible {
  opacity: 1;
  pointer-events: auto;
}

/* ------------------------------ 侧栏 ------------------------------ */
.sidebar {
  flex: 0 0 var(--sidebar-w);
  width: var(--sidebar-w);
  height: 100vh;
  height: 100dvh;
  position: sticky;
  top: 0;
  z-index: 100;
  display: flex;
  flex-direction: column;
  gap: var(--sp-2);
  padding: 24px 20px 20px;
  background: var(--sidebar-bg);
  border-right: 1px solid var(--divider);
  overflow: hidden;
  transition:
    flex-basis var(--dur-slide) var(--ease-out),
    width var(--dur-slide) var(--ease-out),
    padding var(--dur-slide) var(--ease-out),
    background-color var(--dur) var(--ease-out),
    border-color var(--dur) var(--ease-out),
    box-shadow var(--dur) var(--ease-out);
}

/* 玻璃态侧栏 */
body.lg-enable .sidebar {
  background: rgba(var(--lg-bg-rgb), var(--lg-alpha));
  border-right: 1px solid var(--lg-border);
  box-shadow: var(--lg-shadow), var(--lg-inset);
  -webkit-backdrop-filter: blur(var(--lg-blur)) saturate(150%);
  backdrop-filter: blur(var(--lg-blur)) saturate(150%);
}

/* ============================================================================
   品牌区 = 侧栏开关（箭头 ↔ 拉长条）
   ============================================================================ */
.brand {
  position: relative;
  display: flex;
  align-items: center;
  flex-shrink: 0;
  width: 100%;
  height: 38px;
  padding: 0 4px;
  margin: 4px 0 30px;
  border: none;
  background: transparent;
  cursor: pointer;
  border-radius: var(--radius-sm);
  -webkit-tap-highlight-color: transparent;
  transition: background-color var(--dur-fast) var(--ease-out);
}
.brand::after {
  content: '';
  position: absolute;
  left: 0; right: 0; bottom: -16px;
  height: 1px;
  background: var(--divider);
  transition: background-color var(--dur) var(--ease-out);
}
body.lg-enable .brand::after { background: var(--lg-border); }

/* 箭头（收起态显示，居中） */
.brand-arrow {
  position: absolute;
  left: 50%; top: 50%;
  width: 34px; height: 34px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  border-radius: 9px;
  color: var(--textSecondary);
  background: transparent;
  transform: translate(-50%, -50%);
  opacity: 1;
  transition: opacity 160ms var(--ease-out),
              transform 340ms var(--ease-out),
              color var(--dur-fast) var(--ease-out),
              background-color var(--dur-fast) var(--ease-out);
}
.brand-arrow svg { display: block; }

/* 品牌主体（展开态显示，拉长） */
.brand-main {
  display: flex;
  align-items: center;
  gap: 12px;
  min-width: 0;
  max-width: 0;
  opacity: 0;
  overflow: hidden;
  white-space: nowrap;
  transition: max-width var(--dur-slide) var(--ease-out),
              opacity 160ms var(--ease-out);
}
.brand-mark {
  flex: 0 0 auto;
  width: 38px; height: 38px;
  border-radius: 11px;
  display: grid; place-items: center;
  background: var(--accent);
  color: var(--btnText);
  font-size: 17px;
  font-weight: 800;
  box-shadow: 0 4px 14px rgba(var(--accent-rgb), .28);
}
.brand-text { display: flex; flex-direction: column; min-width: 0; line-height: 1.4; }
.brand-name {
  font-size: var(--fs-small);
  font-weight: 700;
  letter-spacing: .02em;
  color: var(--textPrimary);
  white-space: nowrap;
}
.brand-sub {
  font-size: var(--fs-tiny);
  color: var(--textHint);
  letter-spacing: .16em;
  text-transform: uppercase;
  white-space: nowrap;
}

/* 展开态：箭头飞出，品牌主体拉长显现 */
.sidebar[data-collapsed="false"] .brand-arrow {
  opacity: 0;
  transform: translate(calc(-50% - 22px), -50%) scale(.65);
  pointer-events: none;
}
.sidebar[data-collapsed="false"] .brand-main {
  max-width: 220px;
  opacity: 1;
  transition: max-width var(--dur-slide) var(--ease-out),
              opacity 240ms var(--ease-out) 190ms;
}

/* 收起态：箭头延迟浮现 */
.sidebar[data-collapsed="true"] .brand-arrow {
  transition: opacity 180ms var(--ease-out) 150ms,
              transform 340ms var(--ease-out) 110ms,
              color var(--dur-fast) var(--ease-out),
              background-color var(--dur-fast) var(--ease-out);
}

/* 导航 */
.sidebar-nav {
  display: flex;
  flex-direction: column;
  gap: 2px;
  flex: 1;
  min-height: 0;
}
.nav-item {
  position: relative;
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 11px 14px;
  border-radius: var(--radius-sm);
  font-size: var(--fs-sub);
  font-weight: 500;
  color: var(--textSecondary);
  transition: background-color var(--dur-fast) var(--ease-out),
              color var(--dur-fast) var(--ease-out),
              padding var(--dur-slide) var(--ease-out),
              gap var(--dur-slide) var(--ease-out);
}
.nav-icon {
  width: 20px;
  flex: 0 0 auto;
  text-align: center;
  font-size: 15px;
  color: var(--textHint);
  transition: color var(--dur-fast) var(--ease-out);
}
.nav-label { white-space: nowrap; }
.nav-item.active {
  background: var(--emphasis);
  color: var(--accent);
  font-weight: 700;
}
.nav-item.active::before {
  content: '';
  position: absolute;
  left: 0; top: 50%;
  transform: translateY(-50%);
  width: 3px; height: 18px;
  border-radius: 0 3px 3px 0;
  background: var(--accent);
}
.nav-item.active .nav-icon { color: var(--accent); }

/* 玻璃态导航项 */
body.lg-enable .nav-item:hover { background: rgba(var(--lg-pri-rgb), .16); }
body.lg-enable .nav-item.active { background: rgba(var(--lg-pri-rgb), .20); }

/* 侧栏底部 */
.sidebar-foot {
  flex-shrink: 0;
  padding-top: var(--sp-4);
  border-top: 1px solid var(--divider);
  transition: border-color var(--dur) var(--ease-out),
              padding var(--dur-slide) var(--ease-out);
}
body.lg-enable .sidebar-foot { border-top-color: var(--lg-border); }

.theme-toggle {
  width: 100%;
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 10px 13px;
  border-radius: var(--radius-sm);
  border: 1px solid var(--divider);
  background: transparent;
  color: var(--textSecondary);
  font-size: var(--fs-small);
  font-weight: 500;
  white-space: nowrap;
  cursor: pointer;
  transition: border-color var(--dur-fast) var(--ease-out),
              color var(--dur-fast) var(--ease-out),
              background-color var(--dur-fast) var(--ease-out),
              padding var(--dur-slide) var(--ease-out);
}
body.lg-enable .theme-toggle {
  background: rgba(var(--lg-bg-rgb), calc(var(--lg-alpha) * .65));
  border-color: var(--lg-border);
  -webkit-backdrop-filter: blur(10px);
  backdrop-filter: blur(10px);
}
.theme-icon { font-size: 14px; line-height: 1; flex: 0 0 auto; }
.theme-toggle[aria-pressed="true"] {
  color: var(--accent);
  border-color: rgba(var(--accent-rgb), .45);
}

/* 文字折叠 */
.nav-label,
.theme-text {
  max-width: 220px;
  overflow: hidden;
  opacity: 1;
  transition: opacity 220ms var(--ease-out),
              max-width var(--dur-slide) var(--ease-out);
}

/* ------------------------------ 收起态 ------------------------------ */
.sidebar[data-collapsed="true"] {
  flex: 0 0 var(--sidebar-w-collapsed);
  width: var(--sidebar-w-collapsed);
  padding: 24px 10px 16px;
  align-items: center;
}
.sidebar[data-collapsed="true"] .brand {
  justify-content: center;
  padding: 0;
}
.sidebar[data-collapsed="true"] .brand::after {
  left: 4px; right: 4px;
}

.sidebar[data-collapsed="true"] .sidebar-nav {
  width: 100%;
  align-items: center;
}
.sidebar[data-collapsed="true"] .nav-item {
  justify-content: center;
  width: 100%;
  gap: 0;
  padding: 11px 0;
}
.sidebar[data-collapsed="true"] .nav-label {
  opacity: 0; max-width: 0; pointer-events: none;
}
.sidebar[data-collapsed="true"] .nav-icon { width: auto; }
.sidebar[data-collapsed="true"] .nav-item.active::before { opacity: 0; }

.sidebar[data-collapsed="true"] .sidebar-foot { width: 100%; }
.sidebar[data-collapsed="true"] .theme-toggle {
  justify-content: center;
  padding: 10px 0;
  gap: 0;
}
.sidebar[data-collapsed="true"] .theme-text {
  opacity: 0; max-width: 0; pointer-events: none;
}

/* ------------------------------ 主区域 ------------------------------ */
.main {
  flex: 1;
  min-width: 0;
  display: flex;
  justify-content: center;
  padding: 104px 48px 120px;
}
.main-inner { width: 100%; max-width: 540px; }

/* 工具栏 */
.toolbar {
  display: flex;
  flex-wrap: wrap;
  gap: 10px;
  align-items: center;
  padding: 10px 12px;
  margin-bottom: 28px;
  border-radius: var(--radius-md);
  background: var(--cardBg);
  border: 1px solid var(--divider);
  box-shadow: var(--card-shadow);
  transition: background-color var(--dur) var(--ease-out),
              border-color var(--dur) var(--ease-out),
              box-shadow var(--dur) var(--ease-out);
}
body.lg-enable .toolbar {
  background: rgba(var(--lg-bg-rgb), var(--lg-alpha));
  border: 1px solid var(--lg-border);
  box-shadow: var(--lg-inset), var(--lg-soft);
  -webkit-backdrop-filter: blur(var(--lg-blur)) saturate(150%);
  backdrop-filter: blur(var(--lg-blur)) saturate(150%);
}
.toolbar-label {
  font-size: var(--fs-tiny);
  color: var(--textHint);
  letter-spacing: .06em;
}
.toolbar-select {
  height: 34px;
  padding: 0 12px;
  border: none;
  outline: none;
  border-radius: var(--radius-pill);
  background: var(--inputBg);
  color: var(--textPrimary);
  font-size: var(--fs-small);
  cursor: pointer;
}
body.lg-enable .toolbar-select {
  background: rgba(var(--lg-bg-rgb), calc(var(--lg-alpha) * .75));
  border: 1px solid var(--lg-border);
}
.toolbar-btn {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  height: 34px;
  padding: 0 14px;
  border: none;
  border-radius: var(--radius-pill);
  background: var(--inputBg);
  color: var(--textPrimary);
  font-size: var(--fs-small);
  cursor: pointer;
  transition: background-color var(--dur-fast) var(--ease-out),
              color var(--dur-fast) var(--ease-out);
}
.toolbar-btn[aria-pressed="true"] {
  background: var(--accent);
  color: var(--btnText);
}
body.lg-enable .toolbar-btn {
  background: rgba(var(--lg-bg-rgb), calc(var(--lg-alpha) * .75));
  border: 1px solid var(--lg-border);
}
body.lg-enable .toolbar-btn[aria-pressed="true"] {
  background: var(--accent);
  color: var(--btnText);
  border-color: transparent;
}
.toolbar-range {
  width: 110px;
  height: 34px;
  padding: 0;
  accent-color: var(--accent);
  cursor: pointer;
}

/* Hero */
.hero {
  display: flex;
  flex-direction: column;
  align-items: center;
  text-align: center;
  animation: rise .55s var(--ease-out) both;
}
.avatar {
  width: 104px; height: 104px;
  border-radius: 50%;
  object-fit: cover;
  background: var(--inputBg);
  border: 3px solid var(--avatar-ring);
  box-shadow: 0 0 0 1px var(--divider),
              0 14px 34px rgba(var(--accent-rgb), .16);
  margin-bottom: 26px;
  transition: border-color var(--dur) var(--ease-out),
              box-shadow var(--dur) var(--ease-out);
}
body.lg-enable .avatar {
  border-color: var(--lg-border);
  box-shadow: 0 0 0 1px var(--lg-border),
              0 14px 34px rgba(var(--lg-pri-rgb), .16);
}
.name {
  font-size: var(--fs-h1);
  font-weight: 800;
  letter-spacing: .01em;
  line-height: 1.25;
  color: var(--textPrimary);
}
.tagline {
  margin-top: 12px;
  font-size: var(--fs-sub);
  color: var(--textSecondary);
}

/* 联系胶囊 */
.contact-row {
  display: flex;
  flex-wrap: wrap;
  justify-content: center;
  gap: 8px;
  margin-top: 28px;
}
.pill {
  display: inline-flex;
  align-items: center;
  padding: 7px 15px;
  border-radius: var(--radius-pill);
  border: 1px solid var(--divider);
  background: transparent;
  color: var(--textSecondary);
  font-size: var(--fs-small);
  white-space: nowrap;
  transition: border-color var(--dur-fast) var(--ease-out),
              color var(--dur-fast) var(--ease-out),
              background-color var(--dur-fast) var(--ease-out),
              transform var(--dur-fast) var(--ease-out);
}
body.lg-enable .pill {
  background: rgba(var(--lg-bg-rgb), calc(var(--lg-alpha) * .65));
  border-color: var(--lg-border);
  -webkit-backdrop-filter: blur(10px);
  backdrop-filter: blur(10px);
}
a.pill:active { transform: scale(.97); }

/* Pages */
.pages {
  margin-top: 64px;
  animation: rise .55s var(--ease-out) .08s both;
}
.section-label {
  padding-left: 2px;
  margin-bottom: 16px;
  font-size: var(--fs-tiny);
  font-weight: 700;
  letter-spacing: .22em;
  text-transform: uppercase;
  color: var(--textHint);
}
.page-link {
  display: flex;
  align-items: center;
  gap: 16px;
  padding: 17px 20px;
  margin-bottom: 10px;
  border-radius: var(--radius-md);
  border: 1px solid var(--divider);
  background: var(--cardBg);
  color: var(--textPrimary);
  box-shadow: var(--card-shadow);
  transition: transform 240ms var(--ease-out),
              box-shadow 240ms var(--ease-out),
              border-color 240ms var(--ease-out),
              background-color 240ms var(--ease-out);
}
body.lg-enable .page-link {
  background: rgba(var(--lg-bg-rgb), var(--lg-alpha));
  border: 1px solid var(--lg-border);
  box-shadow: var(--lg-inset), var(--lg-soft);
  -webkit-backdrop-filter: blur(var(--lg-blur)) saturate(150%);
  backdrop-filter: blur(var(--lg-blur)) saturate(150%);
}
.page-link:last-child { margin-bottom: 0; }
.page-link:active { transform: scale(.985); }

.page-symbol {
  flex: 0 0 auto;
  width: 40px; height: 40px;
  border-radius: 12px;
  display: grid; place-items: center;
  font-size: 16px;
  background: rgba(var(--accent-rgb), .12);
  color: var(--accent);
}
.page-name {
  flex: 1;
  font-size: 15px;
  font-weight: 700;
  letter-spacing: .01em;
}
.page-arrow {
  font-size: 15px;
  color: var(--textHint);
  transition: transform 240ms var(--ease-out),
              color 240ms var(--ease-out);
}

/* 页脚 */
.foot {
  margin-top: 80px;
  text-align: center;
  font-size: var(--fs-tiny);
  letter-spacing: .14em;
  color: var(--textHint);
  animation: rise .55s var(--ease-out) .16s both;
}

@keyframes rise {
  from { opacity: 0; transform: translateY(12px); }
  to   { opacity: 1; transform: none; }
}

/* ============================================================================
   Layer 5 · 悬停
   ============================================================================ */
@media (hover: hover) and (pointer: fine) {
  .sidebar[data-collapsed="true"] .brand:hover .brand-arrow {
    color: var(--accent);
    background: var(--emphasis);
  }
  .sidebar[data-collapsed="false"] .brand:hover {
    background: var(--emphasis);
  }

  .nav-item:hover { background: var(--emphasis); color: var(--textPrimary); }
  .nav-item:hover .nav-icon { color: var(--accent); }

  .theme-toggle:hover {
    border-color: rgba(var(--accent-rgb), .45);
    color: var(--accent);
  }

  a.pill:hover {
    border-color: rgba(var(--accent-rgb), .5);
    color: var(--accent);
    background: rgba(var(--accent-rgb), .06);
    transform: translateY(-1px);
  }

  .page-link:hover {
    transform: translateY(-2px);
    box-shadow: var(--card-shadow-hover);
    border-color: rgba(var(--accent-rgb), .35);
    background: var(--emphasis);
  }
  .page-link:hover .page-arrow {
    transform: translateX(4px);
    color: var(--accent);
  }
}

/* ============================================================================

@media (max-width: 860px) {

  .name { font-size: 26px; }
  .pages { margin-top: 48px; }
  .foot { margin-top: 56px; }
}

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation-duration: .001ms !important;
    transition-duration: .001ms !important;
    scroll-behavior: auto !important;
  }
}
</style>

<script>
(function () {
  var root = document.documentElement;
  var body = document.body;

  /* ---------------- 主题列表 ---------------- */
  var THEMES = ['reset', 'reset-dark', 'reset-navy', 'purple', 'green', 'blue', 'bw'];

  var themeSelect = document.getElementById('themeSelect');
  var themeBtn = document.getElementById('themeToggle');
  var themeText = themeBtn.querySelector('.theme-text');
  var themeIcon = themeBtn.querySelector('.theme-icon');
  var meta = document.querySelector('meta[name="theme-color"]');

  /* ---------------- 玻璃 / 透明度 ---------------- */
  var glassToggle = document.getElementById('glassToggle');
  var alphaRange = document.getElementById('alphaRange');

  function applyTheme(theme) {
    if (THEMES.indexOf(theme) === -1) theme = 'reset';
    var dark = /-dark$/.test(theme);
    root.setAttribute('data-theme', theme);
    themeBtn.setAttribute('aria-pressed', String(dark));
    themeText.textContent = dark ? '浅色模式' : '深色模式';
    themeIcon.textContent = dark ? '☀' : '☾';
    if (themeSelect) themeSelect.value = theme;
    if (meta) {
      var bg = getComputedStyle(root).getPropertyValue('--pageBg').trim();
      if (bg) meta.setAttribute('content', bg);
    }
    try { localStorage.setItem('swfb-theme', theme); } catch (e) {}
  }

  function applyGlass(on) {
    body.classList.toggle('lg-enable', on);
    glassToggle.setAttribute('aria-pressed', String(on));
    glassToggle.textContent = on ? '玻璃：开' : '玻璃：关';
    try { localStorage.setItem('swfb-glass', on ? '1' : '0'); } catch (e) {}
  }

  function applyAlpha(value) {
    var v = Math.min(1, Math.max(0, parseFloat(value)));
    if (isNaN(v)) v = 0.22;
    root.style.setProperty('--lg-alpha', String(v));
    alphaRange.value = String(v);
    try { localStorage.setItem('swfb-alpha', String(v)); } catch (e) {}
  }

  /* ---------------- 初始化主题 ---------------- */
  var savedTheme = null;
  try { savedTheme = localStorage.getItem('swfb-theme'); } catch (e) {}
  applyTheme(savedTheme && THEMES.indexOf(savedTheme) !== -1 ? savedTheme : 'reset');

  /* ---------------- 初始化玻璃 ---------------- */
  var savedGlass = null;
  try { savedGlass = localStorage.getItem('swfb-glass'); } catch (e) {}
  applyGlass(savedGlass === '1');

  /* ---------------- 初始化透明度 ---------------- */
  var savedAlpha = null;
  try { savedAlpha = localStorage.getItem('swfb-alpha'); } catch (e) {}
  applyAlpha(savedAlpha !== null ? savedAlpha : '0.22');

  /* ---------------- 事件绑定 ---------------- */
  themeSelect.addEventListener('change', function () {
    applyTheme(themeSelect.value);
  });

  themeBtn.addEventListener('click', function () {
    var current = root.getAttribute('data-theme');
    var next = /-dark$/.test(current) ? 'reset' : 'reset-dark';
    applyTheme(next);
  });

  glassToggle.addEventListener('click', function () {
    applyGlass(!body.classList.contains('lg-enable'));
  });

  alphaRange.addEventListener('input', function () {
    applyAlpha(alphaRange.value);
  });

  /* ---------------- 侧栏展开 / 收起 ---------------- */
  var sidebar = document.getElementById('sidebar');
  var brandBtn = document.getElementById('brandToggle');
  var backdrop = document.getElementById('sbBackdrop');
  var SB_KEY = 'swfb-sidebar-collapsed';
  var isNarrow = window.matchMedia('(max-width: 860px)');

  function syncBackdrop() {
    if (!backdrop) return;
    var collapsed = sidebar.getAttribute('data-collapsed') === 'true';
    backdrop.classList.toggle('visible', isNarrow.matches && !collapsed);
  }

  function applySidebar(collapsed) {
    sidebar.setAttribute('data-collapsed', collapsed ? 'true' : 'false');
    brandBtn.setAttribute('aria-expanded', String(!collapsed));
    brandBtn.setAttribute('aria-label', collapsed ? '展开侧栏' : '收起侧栏');
    brandBtn.title = collapsed ? '展开侧栏' : '收起侧栏';
    syncBackdrop();
  }

  var savedSb = null;
  try { savedSb = localStorage.getItem(SB_KEY); } catch (e) {}

  if (isNarrow.matches) {
    applySidebar(savedSb === null ? true : savedSb === 'true');
  } else {
    applySidebar(savedSb === 'true');
  }

  brandBtn.addEventListener('click', function () {
    var next = sidebar.getAttribute('data-collapsed') !== 'true';
    applySidebar(next);
    try { localStorage.setItem(SB_KEY, String(next)); } catch (e) {}
  });

  if (backdrop) {
    backdrop.addEventListener('click', function () {
      applySidebar(true);
      try { localStorage.setItem(SB_KEY, 'true'); } catch (e) {}
    });
  }

  if (isNarrow.addEventListener) {
    isNarrow.addEventListener('change', syncBackdrop);
  } else if (isNarrow.addListener) {
    isNarrow.addListener(syncBackdrop);
  }
  window.addEventListener('resize', syncBackdrop);
})();
</script>
