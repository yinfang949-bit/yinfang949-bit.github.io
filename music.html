   ============================================================================ */

/* 5.1 卡片 ph_card */
.card {
  background: var(--cardBg);
  border-radius: var(--radius-card);
  padding: var(--card-padding);
}

/* 5.2 搜索框 ph_search_bar */
.search-input {
  height: var(--search-height);
  border: none; outline: none;
  background: var(--inputBg);
  border-radius: var(--radius-search);
  padding: 0 var(--sp-md);
  font-size: var(--fs-subtitle);
  color: var(--textPrimary);
}

.btn-accent {
  height: var(--search-height);
  padding: 0 var(--sp-md);
  border-radius: var(--radius-button);
  background: var(--accent);
  color: var(--btnText);
  font-size: var(--fs-subtitle);
}
.btn-accent:active { background: var(--accentPressed); }

/* 5.4 菜单入口 ph_menu_entry */
.menu-entry {
  padding: 12px 8px;
  border-radius: var(--radius-menu-entry);
  background: var(--controlBg);
  color: var(--textPrimary);
  font-size: var(--fs-small);
  text-align: center;
}
.menu-entry:active { background: var(--pressed); }

/* 5.5 播放控制条 */
.play-controls {
  background: var(--controlBg);
  padding: var(--sp-sm) var(--sp-md) 12px;
}

/* 5.6 进度条（SeekBar）—— 2dp 高 */
.seek-track { height: var(--progress-h); background: var(--seekTrack); }
.seek-fill  { background: var(--seekFill); }
.seek-buffered { background: var(--seekSecondary); }

/* 5.7 加载进度条（ProgressStyle） */
.progress-loading { height: 4px; background: var(--progressBg); }
.progress-loading .secondary { background: var(--progressSecondary); }
.progress-loading .primary  { background: var(--accent); }

/* 5.8 歌词遮罩 */
.lyrics-fade-top    { background: linear-gradient(to bottom, var(--pageBg), transparent); }
.lyrics-fade-bottom { background: linear-gradient(to top,    var(--pageBg), transparent); }

/* 5.9 滚动条 */
::-webkit-scrollbar { width: 3px; }
::-webkit-scrollbar-thumb { background: var(--accent); }

/* 5.10 返回按钮 */
.icon-btn {
  width: var(--icon-btn); height: var(--icon-btn);
  border-radius: 18px; padding: 6px;
  color: var(--textPrimary);
}
.icon-btn:active { background: var(--pressed); }

   卡片本身不旋转不缩放，"弧形"完全来自 mask 的波浪边界把卡片上下两端裁掉。
   B 方案：卡片放大到 clamp(112px,34vw,140px)，一次看到 2~3 张。 */
.player-cover-wrap{display:flex;align-items:center;justify-content:center;padding:10px 0;overflow:visible}
.pl-stage{
  position:relative;width:100%;
  --pl-w:clamp(112px,34vw,140px);          /* 卡宽（B 方案偏大） */
  --pl-h:calc(var(--pl-w) / 0.72);         /* 与原版一致：高度 = 卡宽 / 0.72 */
  --pl-gap:calc(var(--pl-w) * 0.072);      /* 卡间距，对应原版 1.78/25 */
  /* 原版横向波浪 mask（1440x500），上下各一条大波浪；照抄不改 */
  --pl-mask:url("data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHdpZHRoPSIxNDQwIiBoZWlnaHQ9IjUwMCIgdmlld0JveD0iMCAwIDE0NDAgNTAwIiBpZD0iaiI+CiAgPHBhdGggZmlsbD0icmdiKDIwMCwyMDAsMjAwKSIgZmlsbC1ydWxlPSJldmVub2RkIiBkPSJNMCAwczI3NS4wNCAxMDAgNzIwIDEwMFMxNDQwIDAgMTQ0MCAwdjUwMHMtMjc1LjA0LTEwMC03MjAtMTAwUzAgNTAwIDAgNTAwVjB6Ii8+Cjwvc3ZnPgo=");
  height:var(--pl-h);
  margin:0 auto;
  /* 关键：舞台自己套 mask，overflow:hidden 让横排卡片被波浪裁切 */
  overflow:hidden;
  -webkit-mask:var(--pl-mask) no-repeat center / 100% 100%;
          mask:var(--pl-mask) no-repeat center / 100% 100%;
  touch-action:pan-y;
}
/* 横排卡片流：等价原版 .img-wrapper（display:flex + translate 平移动画） */
.pl-rail{
  position:absolute;left:0;top:0;
  display:flex;align-items:center;
  height:100%;
  will-change:transform;
  transition:transform .5s ease;
}
.pl-cell{
  flex:none;
  width:var(--pl-w);height:var(--pl-h);
  margin-right:var(--pl-gap);
  position:relative;overflow:hidden;box-sizing:border-box;
  border-radius:14px;
  background:linear-gradient(160deg,#ffffff,#e6e6ef);
  box-shadow:0 12px 30px rgba(0,0,0,.2);
  cursor:pointer;
}
.pl-cell img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}
.pl-cell::after{
  content:"";position:absolute;inset:0;box-sizing:border-box;
  border:5px solid #ffffff;border-radius:14px;pointer-events:none;
  box-shadow:inset 0 0 0 2px rgba(0,0,0,.08);
}
/* 居中那张（= 当前播放）加一点强化，靠遮罩外圈即可，不做缩放避免破坏平铺 */
.pl-cell.is-center{box-shadow:0 16px 40px rgba(0,0,0,.3)}
.pl-cell.is-center::after{border-color:#ffffff}

<script>
/* SWFB-Music v2.12 — 数据源：songs.json（内置）+ IndexedDB（用户上传） */
(function () {
  'use strict';

  /* ============ 1. 内置清单：songs.json ============ */
  function fetchBuiltin() {
    return fetch('songs.json', { cache: 'no-cache' })
      .then(function (r) {
        if (!r.ok) throw new Error('songs.json HTTP ' + r.status);
        return r.json();
      })
      .then(function (list) { return Array.isArray(list) ? list : []; })
      .catch(function (e) {
        console.warn('[SWFB] songs.json 读取失败，改用目录兜底:', e);
        return [];
      });
  }

  /* ============ 2. IndexedDB：用户上传的歌曲 ============ */
  var DB_NAME = 'swfb_music', DB_VER = 1, STORE = 'songs', dbP = null;

  function openDB() {
    if (dbP) return dbP;
    dbP = new Promise(function (res, rej) {
      if (!window.indexedDB) { rej(new Error('浏览器不支持 IndexedDB')); return; }
      var req = indexedDB.open(DB_NAME, DB_VER);
      req.onupgradeneeded = function (e) {
        var db = e.target.result;
        if (!db.objectStoreNames.contains(STORE)) {
          db.createObjectStore(STORE, { keyPath: 'id' });
        }
      };
      req.onsuccess = function () { res(req.result); };
      req.onerror = function () { rej(req.error); };
    });
    return dbP;
  }

  function tx(mode, fn) {
    return openDB().then(function (db) {
      return new Promise(function (res, rej) {
        var t = db.transaction(STORE, mode), s = t.objectStore(STORE), out;
        out = fn(s);
        t.oncomplete = function () { res(out && out.result !== undefined ? out.result : out); };
        t.onerror = function () { rej(t.error); };
        t.onabort = function () { rej(t.error); };
      });
    });
  }

  /* 记录结构：{ id, name, artist, blobAudio, blobCover, mime, coverMime, dur, added } */
  function listLocal() {
    return tx('readonly', function (s) { return s.getAll(); })
      .then(function (rows) { return rows || []; })
      .catch(function (e) { console.warn('[SWFB] 本地歌曲读取失败:', e); return []; });
  }

  function addLocal(rec) {
    return tx('readwrite', function (s) { s.put(rec); return rec; });
  }

  function delLocal(id) {
    return tx('readwrite', function (s) { s.delete(id); });
  }

  /* ============ 3. blob URL 缓存（播放用） ============ */
  var urlCache = {};

  function blobUrl(id, blob, kind) {
    var k = id + ':' + kind;
    if (urlCache[k]) return urlCache[k];
    var u = URL.createObjectURL(blob);
    urlCache[k] = u;
    return u;
  }

  function releaseUrls(id) {
    ['a', 'c'].forEach(function (kind) {
      var k = id + ':' + kind;
      if (urlCache[k]) { URL.revokeObjectURL(urlCache[k]); delete urlCache[k]; }
    });
  }

  /* 把 IndexedDB 记录转成与 songs.json 同构的条目：
     name = 用户填的歌名；audio = blob URL；cover = blob URL（无封面则空） */
  function toSong(rec) {
    return {
      id: rec.id,
      name: rec.name,
      artist: rec.artist || '未知歌手',
      audio: rec.blobAudio ? blobUrl(rec.id, rec.blobAudio, 'a') : '',
      cover: rec.blobCover ? blobUrl(rec.id, rec.blobCover, 'c') : '',
      dur: rec.dur || 0,
      local: true
    };
  }

  /* ============ 4. 统一出口 ============ */
  window.SPFetch = function () {
    return Promise.all([fetchBuiltin(), listLocal()]).then(function (r) {
      var builtin = r[0];
      var local = r[1].map(toSong).filter(function (x) { return x.audio; });
      return { builtin: builtin, local: local };
    });
  };

  window.SPLocal = {
    add: function (file, coverFile, name, artist) {
      var id = 'u' + Date.now();
      return new Promise(function (res, rej) {
        var rec = {
          id: id, name: name, artist: artist || '未知歌手',
          blobAudio: file, mime: file.type || 'audio/mpeg',
          added: Date.now(), dur: 0
        };
        if (!coverFile) { rec.blobCover = null; addLocal(rec).then(res, rej); return; }
        rec.blobCover = coverFile;
        rec.coverMime = coverFile.type || 'image/png';
        addLocal(rec).then(res, rej);
      });
    },
    remove: function (id) {
      releaseUrls(id);
      return delLocal(id);
    },
    list: listLocal
  };

  /* 播放器读到元数据后回写真实时长，下次启动就有正确的进度条长度 */
  window.SPSaveDur = function (id, dur) {
    if (!id || !dur || String(id).charAt(0) !== 'u') return Promise.resolve();
    return tx('readwrite', function (s) {
      var g = s.get(id);
      g.onsuccess = function () {
        var rec = g.result;
        if (rec) { rec.dur = dur; s.put(rec); }
      };
    }).catch(function () { });
  };
})();
</script>

<script>
/* SWFB-Music v2.12 — 数据 / 工具 / 状态 */
(function () {
  'use strict';

  /* 歌曲列表：启动后由 fetch('songs.json') 填充；spmusic 下每个文件夹一首 */
  var SONGS = [];
  var ready = false;

  var LYRIC_POOL = [
    '风把心事吹成了形状', '你还在原地等我吗', '星光落在肩头像旧信',
    '我们都曾那样认真', '路灯把影子拉得很长', '再唱一次那段旋律',
    '时间不肯回头看我', '原来你一直都在'
  ];

  var FILES = [];

  var THEMES = [
    { key: 'violet', name: '暖紫', color: '#9B7FD0' },
    { key: 'violet-dark', name: '深紫', color: '#B79AE8' },
    { key: 'green', name: '绿', color: '#7FD0A1' },
    { key: 'green-dark', name: '绿·暗', color: '#9AE8BD' },
    { key: 'blue', name: '蓝', color: '#7FA5D0' },
    { key: 'blue-dark', name: '蓝·暗', color: '#9ABCE8' }
  ];

  /* 固定渐变池：没有封面可显示时按顺序取一个（用户上传无封面时用） */
  var GRADS = [
    'linear-gradient(135deg,#9B7FD0,#B79AE8)', 'linear-gradient(135deg,#7FD0A1,#9AE8BD)',
    'linear-gradient(135deg,#7FA5D0,#9ABCE8)', 'linear-gradient(135deg,#C98FB0,#E3B3CC)',
    'linear-gradient(135deg,#D0B77F,#E8D59A)', 'linear-gradient(135deg,#7FD0C4,#9AE8DE)'
  ];

  /* ---------- 状态 ---------- */
  var DEF = {
    family: 'violet', dark: false,
    display: 'cover', lyricAnim: true, bgExtract: true,
    controlsTheme: true, bgSpots: true, cache: true,
    queue: [], index: 0, playing: false, pos: 0,
    repeat: 0, favs: [], history: [], nowId: null, lastId: null
  };

  function load() {
    var s = {};
    Object.keys(DEF).forEach(function (k) {
      var v = localStorage.getItem('swfb_' + k);
      if (v === null) { s[k] = DEF[k]; return; }
      try { s[k] = JSON.parse(v); } catch (e) { s[k] = DEF[k]; }
    });
    return s;
  }

  function save(k, v) {
    try { localStorage.setItem('swfb_' + k, JSON.stringify(v)); } catch (e) { }
  }

  var store = load();

  /* ---------- 工具 ---------- */
  function fmt(sec) {
    sec = Math.max(0, Math.floor(sec || 0));
    var m = Math.floor(sec / 60), s = sec % 60;
    return m + ':' + (s < 10 ? '0' + s : s);
  }

  function findSong(id) {
    for (var i = 0; i < SONGS.length; i++) if (SONGS[i].id === id) return SONGS[i];
    return null;
  }

  function makeLyrics(song) {
    var out = [], n = 8, dur = song && song.dur > 1 ? song.dur : 120;
    for (var i = 0; i < n; i++) {
      out.push({ t: Math.round((dur / n) * i), text: LYRIC_POOL[i % LYRIC_POOL.length] });
    }
    return out;
  }

  /* 从 --accent 派生三个光斑色 */
  function hexA(hex, a) {
    hex = (hex || '#9B7FD0').trim();
    if (hex.charAt(0) !== '#') return hex;
    if (hex.length === 4) hex = '#' + hex[1] + hex[1] + hex[2] + hex[2] + hex[3] + hex[3];
    var r = parseInt(hex.slice(1, 3), 16),
        g = parseInt(hex.slice(3, 5), 16),
        b = parseInt(hex.slice(5, 7), 16);
    return 'rgba(' + r + ',' + g + ',' + b + ',' + a + ')';
  }

  /* ---------- 加载歌曲清单 ---------- */
  /* 规则（不可改）：name = 文件夹名原样；audio/cover 来自该文件夹内的 audio.* 与 cover.* */
  function normalize(list, prefix) {
    var out = [];
    list.forEach(function (x, i) {
      if (!x || !x.name || !x.audio) return;
      out.push({
        id: x.id || (prefix + i),
        name: x.name,
        artist: x.artist || '未知歌手',
        audio: x.audio,
        cover: x.cover || '',
        grad: x.grad || GRADS[i % GRADS.length],
        dur: typeof x.dur === 'number' && x.dur > 0 ? x.dur : 0,
        local: !!x.local
      });
    });
    return out;
  }

  function loadSongs() {
    return window.SPFetch ? window.SPFetch() : Promise.resolve({ builtin: [], local: [] });
  }

  var p = loadSongs().then(function (data) {
    var builtin = normalize(data.builtin || [], 's');
    var local = normalize(data.local || [], 'u');
    SONGS.length = 0;
    Array.prototype.push.apply(SONGS, builtin.concat(local));
    ready = true;
    return SONGS;
  }).catch(function (e) {
    console.warn('[SWFB] 歌曲清单加载失败:', e);
    ready = true;
    return SONGS;
  });

  window.APP = {
    SONGS: SONGS, FILES: FILES, THEMES: THEMES, GRADS: GRADS, LYRIC_POOL: LYRIC_POOL,
    store: store, save: save, fmt: fmt, findSong: findSong,
    makeLyrics: makeLyrics, hexA: hexA,
    ready: function () { return ready; },
    whenReady: p,
    refresh: loadSongs
  };
})();
</script>
<script>
/* SWFB-Music v2.11 — 主逻辑（三态联动 + 播放器） */
(function () {
  'use strict';
  var A = window.APP, S = A.SONGS, st = A.store;
  var icon = window.icon || function () { return ''; };
  A.icon = icon;
  var $ = function (id) { return document.getElementById(id); };
  var phone = $('phone');

  /* ---------- 注入结构 ---------- */
  phone.innerHTML = window.SHELL_HTML + window.SHELL_MAIN + window.SHELL_SUB + window.SHELL_MORE + window.SHELL_MINI;
  var miniBar = $('mini-bar');

  /* ---------- 主题应用 ---------- */
  function applyTheme() {
    document.documentElement.setAttribute('data-theme', st.family + (st.dark ? '-dark' : ''));
    var acc = getComputedStyle(document.documentElement).getPropertyValue('--accent').trim();
    document.documentElement.style.setProperty('--ambBlob1', A.hexA(acc, .22));
    document.documentElement.style.setProperty('--ambBlob2', A.hexA(acc, .16));
    document.documentElement.style.setProperty('--ambBlob3', A.hexA(acc, .12));
  }
  applyTheme();

  /* ---------- 三态：木马 ---------- */
  var carIdx = 0, arcIdx = 0;
  var ringEl = $('ring-content'), carDots = $('car-dots');
  /* 3D 环形：渲染 6 张（六边形），整环按 60° 步进切换，居中卡始终在 k=0 */
  var RING_N = 6, RING_STEP = 360 / RING_N;
  var RING_TIME = 620;
  var ringBusy = false, ringSwapTimer = null, ringPending = 0;
  /* 槽位偏移：k=0 居中，1/2/3 往右依次后退，4/5 往左 */
  var RING_OFF = [0, 1, 2, 3, -2, -1];
  function ringSlot(k) { return (carIdx + RING_OFF[k] + S.length * 9) % (S.length || 1); }
  function ringLayout() {
    /* 卡面边长取舞台宽的 46%、上限 260px；六边形环半径 = 半边长 / tan(30°) ≈ 0.866w */
    var stage = ringEl.parentNode;
    var sw = (stage && stage.clientWidth) || window.innerWidth || 375;
    var w = Math.min(Math.round(sw * 0.46), 260);
    ringEl.style.setProperty('--ring-w', w + 'px');
    ringEl.style.setProperty('--ring-z', Math.round(w * 0.866) + 'px');
  }
  function renderCarousel() {
    if (!S.length) { ringEl.innerHTML = ''; carDots.innerHTML = ''; return; }
    if (carIdx >= S.length) carIdx = 0;
    ringEl.innerHTML = [0, 1, 2, 3, 4, 5].map(function (k) {
      var s = S[ringSlot(k)];
      return '<div class="ring-item' + (k === 0 ? ' is-front' : '') + '" data-k="' + k + '" ' +
        'style="transform:rotateY(' + (k * RING_STEP) + 'deg) translateZ(var(--ring-z))">' +
        '<div style="position:absolute;inset:0;background:' + s.grad + '">' +
        (s.cover ? '<img src="' + s.cover + '" alt="" loading="lazy" onerror="this.remove()">' : '') +
        '<span class="ri-ph">' + A.icon('i-music') + '</span>' +
        '<div class="ri-mask"></div></div>' +
        '<div class="ri-body"><div class="ri-title">' + s.name + '</div>' +
        '<div class="ri-artist">' + s.artist + '</div></div></div>';
    }).join('');
    carDots.innerHTML = [0, 1, 2, 3, 4, 5].map(function (k) {
      return '<i class="' + (k === 0 ? 'on' : '') + '" data-k="' + k + '"></i>';
    }).join('');
    ringLayout();
    rotateCarousel(true);
  }
  /* animate=false 时先转过渡，用于重建后立即归位 */
  function rotateCarousel(animate) {
    if (!animate) ringEl.classList.add('dragging');
    ringEl.style.transform = 'translateZ(0) rotateY(0deg)';
    if (!animate) { ringEl.offsetHeight; ringEl.classList.remove('dragging'); }
  }
  function goCarousel(dir) {
    if (S.length < 2) return;
    if (ringBusy) { ringPending = dir > 0 ? 1 : -1; return; }
    ringBusy = true;
    carIdx = (carIdx + (dir > 0 ? 1 : -1) + S.length) % S.length;
    /* 真正转一面：整环从 0° 平滑转到 ±60°，此刻旧 k=1（或 k=5）的卡正好转到正面 */
    var to = dir > 0 ? -RING_STEP : RING_STEP;
    ringEl.classList.remove('dragging');
    ringEl.style.transform = 'translateZ(0) rotateY(' + to + 'deg)';
    /* 转到位后，同一帧内「角度归零 + 重建内容」→ 新 k=0 就是刚转到正面的那张，视觉完全无缝 */
    if (ringSwapTimer) clearTimeout(ringSwapTimer);
    ringSwapTimer = setTimeout(function () {
      ringEl.classList.add('dragging');
      ringEl.style.transform = 'translateZ(0) rotateY(0deg)';
      renderCarousel();
      void ringEl.offsetHeight;
      ringEl.classList.remove('dragging');
      ringBusy = false;
      if (ringPending) { var pd = ringPending; ringPending = 0; goCarousel(pd); }
    }, RING_TIME);
  }
  window.__carGo = goCarousel;

  /* ---------- 三态：圆盘（极坐标旋转） ---------- */
  var stageHome = $('stage-home'), layerList = $('layer-list'), layerDetail = $('layer-detail');
  var arcTrain = $('arc-train');
  var arcIdx = 0, arcBoxList = [];
  var wheelPos = 0;      /* 以「首」为单位的连续位置，可为小数（拖动中） */
  var WSTEP = 30;        /* 相邻两首的圆心角（度） */
  var WHALF = 58;        /* 可见圆心角上限，超过这个角度直接隐形 */
  /* 半径与拖拽灵敏度跟着容器尺寸走；半径过大会把两侧卡推出屏外 */
  function wheelGeo() {
    var box = (arcTrain && arcTrain.parentNode) || document.documentElement;
    var W = box.clientWidth || 340, H = box.clientHeight || 260;
    var R = Math.min(W * 0.42, H * 0.62, 170);
    if (!(R > 60)) R = 110;
    return { R: R, px: Math.max(52, W * 0.22) };
  }
  /* 距中心位的「首」数，归一化到 (-n/2, n/2]，唯一数据源是 wheelPos */
  function wheelRel(i) {
    var n = S.length;
    if (!n) return 0;
    var d = i - wheelPos;
    d = ((d % n) + n) % n;
    if (d > n / 2) d -= n;
    return d;
  }
  /* 纯 transform 定位：只写 transform/opacity，合成层完成，无重排 */
  function wheelPaint() {
    var n = S.length;
    var g = wheelGeo();
    [].forEach.call(arcBoxList, function (el) {
      var ang = wheelRel(+el.dataset.i) * WSTEP;
      var a = Math.abs(ang);
      var rad = ang * Math.PI / 180;
      var x = Math.sin(rad) * g.R;
      var y = g.R * (1 - Math.cos(rad));          /* 弧顶为 0，越往两侧越往下沉 */
      var k = a / WHALF;                          /* 0=正中 1=视界边缘 */
      var sc = 1.06 - 0.34 * Math.min(1, k);
      var op = k >= 1 ? 0 : (k > 0.7 ? (1 - k) / 0.3 : 1);
      el.style.transform = 'translate(-50%,-50%) translate(' + x.toFixed(2) + 'px,' + y.toFixed(2) + 'px) rotate(' + (ang * 0.55).toFixed(2) + 'deg) scale(' + sc.toFixed(3) + ')';
      el.style.opacity = op;
      el.style.pointerEvents = op > 0.3 ? 'auto' : 'none';
      el.style.zIndex = String(300 - Math.round(a));
      el.dataset.sc = sc.toFixed(3);
      el.classList.toggle('is-center', a < WSTEP * 0.5);
    });
    if (!n) return;
    arcIdx = ((Math.round(wheelPos) % n) + n) % n;
    var s = S[arcIdx];
    if (s) {
      $('ah-title').textContent = s.name;
      $('ah-artist').textContent = s.artist;
    }
  }
  function renderArc() {
    var n = S.length;
    if (!n) return;
    wheelPos = ((carIdx % n) + n) % n;
    arcTrain.innerHTML = S.map(function (x, i) {
      return '<div class="arc-item" data-i="' + i + '">' +
        '<div class="ai-cover" style="background:' + x.grad + '">' + (x.cover ? '<img src="' + x.cover + '" alt="" loading="lazy" onerror="this.remove()">' : '') + '<span class="ph">' + A.icon('i-music') + '</span></div>' +
        '<div class="ai-info"><div class="ai-title">' + x.name + '</div>' +
        '<div class="ai-artist">' + x.artist + '</div></div></div>';
    }).join('');
    arcBoxList = [].slice.call(arcTrain.children);
    arcBoxList.forEach(function (el) { el.style.transition = 'none'; });
    wheelPaint();
    void arcTrain.offsetWidth;
    arcBoxList.forEach(function (el) { el.style.transition = ''; });
  }
  function layoutArc() { wheelPaint(); }
  function arcSeat() { wheelPaint(); }
  function arcStep(dir) {
    if (!S.length) return;
    wheelPos = Math.round(wheelPos) + (dir > 0 ? 1 : -1);
    wheelPaint();
  }
  function arcTo(i) {
    var n = S.length;
    if (!n) return;
    var d = i - wheelPos;
    d = ((d % n) + n) % n;
    if (d > n / 2) d -= n;      /* 走最短路径，不绕远 */
    wheelPos += d;
    wheelPaint();
  }
  /* FLIP：卡片从详情页居中位飞到播放页封面位（缓动对齐参考文件） */
  function flyToPlayer(fromEl, cb) {
    var cover = phone.querySelector('#view-player .pl-cell.is-center') || phone.querySelector('#view-player .pl-cell');
    if (!fromEl || !cover) { cb(); return; }
    var r0 = fromEl.getBoundingClientRect();
    if (!r0.width) { cb(); return; }
    /* 卡片带 rotate，rect 是外接框（偏大）；取中心点 + 未旋转尺寸×scale 才是真实卡面 */
    var sc0 = parseFloat(fromEl.dataset.sc) || 1;
    var cw = fromEl.offsetWidth * sc0, ch = fromEl.offsetHeight * sc0;
    var a = { left: r0.left + r0.width / 2 - cw / 2, top: r0.top + r0.height / 2 - ch / 2, width: cw, height: ch };
    var cimg = fromEl.querySelector('.ai-cover'), bg = '';
    if (cimg) {
      var im = cimg.querySelector('img');
      if (im && im.src) bg = 'url("' + im.src + '")';
      else {
        var g = getComputedStyle(cimg).backgroundImage;
        if (g && g !== 'none') bg = g;
      }
    }
    var card = document.createElement('div');
    card.className = 'fly-card';
    if (bg) card.style.backgroundImage = bg;
    card.style.left = a.left + 'px';
    card.style.top = a.top + 'px';
    card.style.width = a.width + 'px';
    card.style.height = a.height + 'px';
    var _cs = getComputedStyle(fromEl);

  function renderDls() {
    var ids = st.cache || [];
    var list = ids.map(A.findSong).filter(Boolean);
    $('dl-list').innerHTML = list.length ? list.map(function (s) { return card(s); }).join('')
      : '<div class="empty">暂无下载内容</div>';
  }
  function renderFiles() {
    $('files-list').innerHTML = A.FILES.map(function (f) {
      var ico = f.type === 'audio' ? 'i-music' : (f.type === 'image' ? 'i-palette' : 'i-text');
      return '<div class="import-row"><div class="ir-name">' + A.icon(ico) + ' ' + f.name +
        '<br><span style="font-size:var(--fs-small);color:var(--textSecondary)">' + f.size + '</span></div>' +
        '<button class="ir-pick" data-file="' + f.name + '">查看</button></div>';
    }).join('');
  }

  function renderSettings() {
    var dots = $('theme-dots');
    dots.innerHTML = A.THEMES.map(function (t, i) {
      return '<div class="dot' + (t.family === st.family && t.dark === st.dark ? ' on' : '') +
        '" data-ti="' + i + '" style="background:' + t.color + '"></div>';
    }).join('');
    $('sw-dark').classList.toggle('on', st.dark);
    $('sw-lyric').classList.toggle('on', st.lyricAnim);
    $('sw-spots').classList.toggle('on', st.bgSpots);
    $('sw-extract').classList.toggle('on', st.bgExtract);
    $('sw-ctrl').classList.toggle('on', st.controlsTheme === 'fill');
  }

  function doSearch(q) {
    var box = $('search-result');
    q = q.trim().toLowerCase();
    if (!q) { box.innerHTML = '<div class="empty">输入关键词开始搜索</div>'; return; }
    var r = S.filter(function (s) {
      return s.name.toLowerCase().indexOf(q) > -1 || s.artist.toLowerCase().indexOf(q) > -1;
    });
    box.innerHTML = r.length ? r.map(function (s) { return card(s); }).join('')
      : '<div class="empty">没有找到相关歌曲</div>';
  }

  /* ---------- 事件 ---------- */
  function bindTaps() {
    phone.addEventListener('click', function (e) {
      var t = e.target;
      var cardEl = t.closest ? t.closest('.music-card') : null;
      var moreEl = t.closest ? t.closest('.mc-more') : null;
      var delEl = t.closest ? t.closest('[data-del]') : null;
      if (t.closest && t.closest('#btn-go-import')) { nav('import'); return; }
      if (moreEl) { e.stopPropagation(); openSheet(moreEl.dataset.more); return; }
      if (delEl) {
        e.stopPropagation();
        var did = delEl.dataset.del;
        var ds = A.findSong(did);
        ask('删除歌曲', '确定删除《' + (ds ? ds.name : '') + '》？', function () {
          if (!window.SPLocal) { toast('删除功能未加载'); return; }
          window.SPLocal.remove(did).then(function () { return reload(); }).then(function () {
            st.favs = st.favs.filter(function (x) { return x !== did; });
            st.history = st.history.filter(function (x) { return x !== did; });
            A.save('favs', st.favs); A.save('history', st.history);
            if (st.nowId === did) { st.nowId = null; A.save('nowId', null); syncMini(); }
            renderLocal(); toast('已删除');
          }).catch(function (err) { toast('删除失败：' + err.message); });
        });
        return;
      }
      if (cardEl) {
        var q = [].map.call(cardEl.parentNode.querySelectorAll('.music-card'), function (x) { return x.dataset.id; });
        playSong(cardEl.dataset.id, q);
        nav('player'); $('view-player').classList.add('on');
        return;
      }
    });
  }

  /* ---------- sheet ---------- */
  var sheetSong = null;
  function openSheet(id) {
    sheetSong = id;
    $('sheet-mask').classList.add('on');
    $('sheet').classList.add('on');
  }
  function closeSheet() {
    $('sheet-mask').classList.remove('on');
    $('sheet').classList.remove('on');
  }

  /* ---------- 三态事件 ---------- */
  function bindStage() {
    ringEl.addEventListener('click', function (e) {
      var c = e.target.closest('.ring-item');
      if (!c) return;
      var k = +c.dataset.k;
      if (k !== 0) { goCarousel(RING_OFF[k] > 0 ? 1 : -1); return; }
      toDetail();
    });
    $('car-prev').addEventListener('click', function () { goCarousel(-1); });
    $('car-next').addEventListener('click', function () { goCarousel(1); });
    carDots.addEventListener('click', function (e) {
      if (e.target.tagName !== 'I') return;
      var k = +e.target.dataset.k;
      if (k === 0) return;
      goCarousel(RING_OFF[k] > 0 ? 1 : -1);
    });
    /* 首页环形滑动手势（与详情页一致，30px 阈值） */
    var ringSX = 0, ringDX = 0;
    ringEl.addEventListener('touchstart', function (e) {
      ringSX = e.touches[0].clientX; ringDX = 0;
    }, { passive: true });
    ringEl.addEventListener('touchmove', function (e) {
      ringDX = e.touches[0].clientX - ringSX;
    }, { passive: true });
    ringEl.addEventListener('touchend', function () {
      if (Math.abs(ringDX) < 30) return;
      goCarousel(ringDX < 0 ? 1 : -1);
      ringDX = 0;
    });
    window.addEventListener('resize', function () { if (S.length) ringLayout(); });

    /* ---------- 圆盘：拖动旋转，松手吸附；未拖动则当作点击 ---------- */
    var wDown = false, wDrag = false, wSX = 0, wSY = 0, wPos0 = 0, wPX = 60, wTarget = null;
    arcTrain.addEventListener('pointerdown', function (e) {
      if (!S.length) return;
      wDown = true; wDrag = false;
      wTarget = (e.target && e.target.closest) ? e.target.closest('.arc-item') : null;
      wSX = e.clientX; wSY = e.clientY;
      wPos0 = wheelPos; wPX = wheelGeo().px;
      arcTrain.classList.add('dragging');
      var wrap = arcTrain.parentNode;
      if (wrap && wrap.classList) wrap.classList.add('dragging');
      if (arcTrain.setPointerCapture) { try { arcTrain.setPointerCapture(e.pointerId); } catch (_) {} }
    });
    arcTrain.addEventListener('pointermove', function (e) {
      if (!wDown) return;
      var dx = e.clientX - wSX, dy = e.clientY - wSY;
      if (!wDrag) {
        if (Math.abs(dx) < 7) return;
        if (Math.abs(dx) <= Math.abs(dy)) return;   /* 纵向手势放行，不当拖拽 */
        wDrag = true;
      }
      wheelPos = wPos0 - dx / wPX;
      wheelPaint();
    });
    function wheelRelease(e) {
      if (!wDown) return;
      wDown = false;
      var tgt = wTarget; wTarget = null;
      arcTrain.classList.remove('dragging');
      var wrap = arcTrain.parentNode;
      if (wrap && wrap.classList) wrap.classList.remove('dragging');
      if (wDrag) {                       /* 拖过：吸附到最近卡位，不回弹原处 */
        wDrag = false;
        wheelPos = Math.round(wheelPos);
        wheelPaint();
        return;
      }
      var it = tgt || ((e.target && e.target.closest) ? e.target.closest('.arc-item') : null);
      if (!it) return;
      if (!it.classList.contains('is-center')) { arcTo(+it.dataset.i); return; }
      var i = +it.dataset.i;
      playSong(S[i].id, S.map(function (x) { return x.id; }));
      toMini();
    }
    arcTrain.addEventListener('pointerup', wheelRelease);
    arcTrain.addEventListener('pointercancel', function () {
      wDown = false; wDrag = false; wTarget = null;
      arcTrain.classList.remove('dragging');
      var wrap = arcTrain.parentNode;
      if (wrap && wrap.classList) wrap.classList.remove('dragging');
      wheelPos = Math.round(wheelPos);
      wheelPaint();
    });
    /* 兜底：无 Pointer 事件的老内核退回 touch 拖拽 */
    if (!window.PointerEvent) {
      arcTrain.addEventListener('touchstart', function (e) {
        if (!S.length) return;
        wDown = true; wDrag = false;
        wSX = e.touches[0].clientX; wSY = e.touches[0].clientY;
        wPos0 = wheelPos; wPX = wheelGeo().px;
        arcTrain.classList.add('dragging');
      }, { passive: true });
      arcTrain.addEventListener('touchmove', function (e) {
        if (!wDown) return;
        var dx = e.touches[0].clientX - wSX, dy = e.touches[0].clientY - wSY;
        if (!wDrag) {
          if (Math.abs(dx) < 7 || Math.abs(dx) <= Math.abs(dy)) return;
          wDrag = true;
        }
        wheelPos = wPos0 - dx / wPX;
        wheelPaint();
      }, { passive: true });
      arcTrain.addEventListener('touchend', function (e) {
        var it = (e.target && e.target.closest) ? e.target.closest('.arc-item') : null;
        wheelRelease({ target: it });
      });
    }
    /* 中间「进入播放页」：播当前居中那首，再打开播放页 */
    $('arc-play').addEventListener('click', function () {
      var i = arcIdx;
      if (S[i]) playSong(S[i].id, S.map(function (x) { return x.id; }));
      if (!st.nowId) return;
      var src = null;
      [].forEach.call(arcBoxList, function (el) { if (+el.dataset.i === i) src = el; });
      showMini(false);
      flyToPlayer(src, function () {
        $('view-player').classList.add('on');
        [].forEach.call(phone.querySelectorAll('.view'), function (v) {
          if (v.id !== 'view-player') v.classList.remove('on');
        });
        /* 详情层收回归位：返回键落到列表，不再复现详情 */
        layerDetail.classList.remove('on');
        layerList.classList.add('on');
        renderNow();
      });
    });
    $('arc-back').addEventListener('click', function () { toList(); });
    $('arc-collapse').addEventListener('click', function () { toMini(); });

    $('mini-toggle').addEventListener('click', function (e) { e.stopPropagation(); toggle(); });
    $('mini-open').addEventListener('click', openPlayerFromMini);
    $('mini-open2').addEventListener('click', openPlayerFromMini);
    $('mini-close').addEventListener('click', function (e) { e.stopPropagation(); closeNow(); });

    function openPlayerFromMini() {
      if (!st.nowId) return;
      showMini(false);
      $('view-player').classList.add('on');
      [].forEach.call(phone.querySelectorAll('.view'), function (v) {
        if (v.id !== 'view-player') v.classList.remove('on');
      });
      renderNow();
    }
  }
    /* 关闭当前播放：停止音频、清空状态、收起迷你条 */
    function closeNow() {
      try { AU.pause(); } catch (e1) {}
      try { AU.currentTime = 0; } catch (e1b) {}
      if (st.nowId != null) st.lastId = st.nowId;
      AU.dataset.sid = '';
      st.nowId = null;
      st.playing = false;
      st.pos = 0;
      A.save('nowId', null);
      var _railEl = $('pl-rail'); if (_railEl) _railEl.innerHTML = '';
      $('player-fill').style.width = '0%';
      $('player-knob').style.left = '0%';
      $('player-cur').textContent = '0:00';
      $('mini-fill').style.width = '0%';
      $('btn-toggle').innerHTML = A.icon('i-play');
      showMini(false);
      syncMini();
      if ($('view-player').classList.contains('on')) {
        $('view-player').classList.remove('on');
        $('view-player').classList.remove('show-detail');
        nav('main');
      }
      toast('已关闭播放');
    }

  /* ---------- 播放器事件 ---------- */
  function bindPlayer() {
    $('player-back').addEventListener('click', function () {
      $('view-player').classList.remove('on');
      $('view-player').classList.remove('show-detail');
      if (st.nowId) showMini(true);
      nav('main');
    });
    $('player-lyrics').addEventListener('click', function () {
      $('view-player').classList.add('show-detail');
    });
    $('detail-back').addEventListener('click', function () {
      $('view-player').classList.remove('show-detail');
    });
    $('detail-more').addEventListener('click', function () {
      if (st.nowId) openSheet(st.nowId);
    });
    $('btn-toggle').addEventListener('click', toggle);
    $('btn-prev').addEventListener('click', function () { step(-1); });
    $('btn-next').addEventListener('click', function () { step(1); });
    $('btn-repeat').addEventListener('click', function () {
      st.repeat = st.repeat === 'one' ? 'all' : (st.repeat === 'all' ? 'off' : 'one');
      A.save('repeat', st.repeat);
      $('btn-repeat').classList.toggle('active', st.repeat !== 'off');
      toast(st.repeat === 'one' ? '单曲循环' : (st.repeat === 'all' ? '列表循环' : '不循环'));
    });
    $('btn-fav').addEventListener('click', function () {
      if (!st.nowId) return;
      var i = st.favs.indexOf(st.nowId);
      if (i > -1) { st.favs.splice(i, 1); toast('已取消收藏'); }
      else { st.favs.push(st.nowId); toast('已收藏'); }
      A.save('favs', st.favs);
      renderNow();
    });
    $('player-track').addEventListener('click', function (e) {
      var r = this.getBoundingClientRect();
      var s = A.findSong(st.nowId);
      if (!s) return;
      st.pos = Math.max(0, Math.min(1, (e.clientX - r.left) / r.width)) * durOf(s); AU.currentTime = st.pos;
      paint();
    });
    $('player-lyrics-list').addEventListener('click', function (e) {
      var l = e.target.closest('.line');
      if (!l) return;
      st.pos = +l.dataset.t; AU.currentTime = st.pos;
      paint();
    });
  }

  /* ---------- 其余 UI 事件 ---------- */
  function bindUI() {
    bindTaps(); bindStage(); bindPlayer();

    /* 首页入口 */
    [].forEach.call(phone.querySelectorAll('[data-go]'), function (el) {
      el.addEventListener('click', function () { nav(el.dataset.go); });
    });
    var histTop = $('btn-history-top');
    if (histTop) histTop.addEventListener('click', function () { nav('history'); });
    var mainSearch = $('main-search');
    if (mainSearch) mainSearch.addEventListener('click', function () { nav('search'); });

    /* 返回按钮 */
    var backs = ['search-back', 'history-back', 'fav-back', 'dl-back', 'files-back', 'import-back', 'settings-back', 'local-back'];
    backs.forEach(function (id) {
      var el = $(id);
      if (el) el.addEventListener('click', function () { nav('main'); });
    });

    $('search-input').addEventListener('input', function () { doSearch(this.value); });

    $('btn-clear-history').addEventListener('click', function () {
      ask('清空记录', '确定清空全部播放记录？', function () {
        st.history = []; A.save('history', []); renderHistory(); toast('已清空');
      });
    });

    /* 主题点 */
    $('theme-dots').addEventListener('click', function (e) {
      var d = e.target.closest('.dot');
      if (!d) return;
      var t = A.THEMES[+d.dataset.ti];
      st.family = t.family; st.dark = t.dark;
      A.save('family', st.family); A.save('dark', st.dark);
      applyTheme(); renderSettings();
    });

    function sw(id, key, after) {
      $(id).addEventListener('click', function () {
        st[key] = !st[key];
        A.save(key, st[key]);
        this.classList.toggle('on', st[key]);
        if (after) after();
      });
    }
    sw('sw-dark', 'dark', function () { applyTheme(); renderSettings(); });
    sw('sw-lyric', 'lyricAnim', function () { phone.classList.toggle('lyric-anim', st.lyricAnim); });
    sw('sw-spots', 'bgSpots', function () { phone.classList.toggle('spots', st.bgSpots); });
    sw('sw-extract', 'bgExtract');
    $('sw-ctrl').addEventListener('click', function () {
      st.controlsTheme = st.controlsTheme === 'fill' ? 'outline' : 'fill';
      A.save('controlsTheme', st.controlsTheme);
      this.classList.toggle('on', st.controlsTheme === 'fill');
    });

    /* sheet */
    $('sh-cancel').addEventListener('click', closeSheet);
    $('sheet-mask').addEventListener('click', function (e) {
      if (e.target.id === 'sheet-mask') closeSheet();
    });
    $('sh-lyrics').addEventListener('click', function () {
      closeSheet(); playSong(sheetSong, null);
      $('view-player').classList.add('on');
      $('view-player').classList.add('show-detail');
    });
    $('sh-download').addEventListener('click', function () {
      if (st.cache.indexOf(sheetSong) < 0) st.cache.push(sheetSong);
      A.save('cache', st.cache); closeSheet(); toast('已加入下载');
    });
    $('sh-add').addEventListener('click', function () {
      st.queue.push(sheetSong); A.save('queue', st.queue); closeSheet(); toast('已加入队列');
    });
    $('sh-link').addEventListener('click', function () {
      closeSheet(); toast('链接已复制（演示）');
    });
    $('sh-clear').addEventListener('click', function () {
      closeSheet();
      ask('清除缓存', '将清空已下载记录，确定继续？', function () {
        st.cache = []; A.save('cache', []); toast('缓存已清除');
      });
    });

    /* 对话框 */
    $('dlg-no').addEventListener('click', function () { $('dlg-mask').classList.remove('on'); dlgCb = null; });
    $('dlg-yes').addEventListener('click', function () {
      $('dlg-mask').classList.remove('on');
      if (dlgCb) { var f = dlgCb; dlgCb = null; f(); }
    });

    /* 导入 */
    $('pk-audio').addEventListener('click', function () { $('file-audio').click(); });
    $('pk-cover').addEventListener('click', function () { $('file-cover').click(); });
    $('pk-lyrics').addEventListener('click', function () { $('file-lyrics').click(); });
    $('file-audio').addEventListener('change', function () {
      $('pk-audio-name').textContent = this.files[0] ? this.files[0].name : '未选择音频文件';
    });
    $('file-cover').addEventListener('change', function () {
      $('pk-cover-name').textContent = this.files[0] ? this.files[0].name : '未选择封面';
    });
    $('file-lyrics').addEventListener('change', function () {
      $('pk-lyrics-name').textContent = this.files[0] ? this.files[0].name : '未选择歌词';
    });
    $('btn-import').addEventListener('click', function () {
      var name = $('input-name').value.trim();
      if (!name) { toast('请填写歌名'); return; }
      var fa = $('file-audio').files[0];
      if (!fa) { toast('请选择音频文件'); return; }
      var fc = $('file-cover').files[0] || null;
      var artist = $('input-artist').value.trim() || '未知歌手';
      if (!window.SPLocal) { toast('本地上传功能未加载'); return; }
      toast('正在保存…');
      window.SPLocal.add(fa, fc, name, artist).then(function () {
        return reload();
      }).then(function () {
        $('input-name').value = ''; $('input-artist').value = '';
        $('file-audio').value = ''; $('file-cover').value = ''; $('file-lyrics').value = '';
        $('pk-audio-name').textContent = '未选择音频文件';
        $('pk-cover-name').textContent = '未选择封面';
        $('pk-lyrics-name').textContent = '未选择歌词';
        toast('导入成功，已存入本机');
        nav('local');
      }).catch(function (err) {
        toast('保存失败：' + (err && err.message ? err.message : err));
      });
    });
  }

  A.whenReady.then(function () {
    renderCarousel();
    if (st.nowId) { renderNow(); paint(); }
  }).catch(function () { renderCarousel(); });
  showMini(!!st.nowId);
  bindAudio(); if (st.nowId) { renderNow(); paint(); }
  bindUI();
  bindRail();
  var h = (location.hash || '#main').slice(1);
  nav(VIEWS.indexOf(h) > -1 ? h : 'main');
  window.addEventListener('resize', function () {
    if (layerDetail.classList.contains('on')) layoutArc();
    renderRail();
  });
})();

</script>
</body>
</html>
