<!DOCTYPE html>
<html lang="zh-CN" data-theme="reset">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F6F1E8">
<title>备忘录 · 春暖花开</title>
<style>
/* ============================================================================
   Layer 1 · 设计令牌
   ============================================================================ */
:root,
[data-theme="reset"] {
  --pageBg:#F6F1E8; --cardBg:#EFE8DC; --inputBg:#E7DECF; --hoverBg:#DFD4C1;
  --emphasis:#E4DAC8; --divider:#DFD4C1;
  --accent:#B4552B; --accentDark:#9E471F; --accentPressed:#853A17;
  --accent-rgb:180,85,43;
  --textPrimary:#262117; --textSecondary:#5D5545; --textHint:#9C937F;
  --btnText:#FFFFFF;
  color-scheme: light;
}
[data-theme="reset-dark"] {
  --pageBg:#171310; --cardBg:#1F1A15; --inputBg:#262019; --hoverBg:#2E261D;
  --emphasis:#241E17; --divider:#3A3022;
  --accent:#D98A4E; --accentDark:#C8783B; --accentPressed:#B4672C;
  --accent-rgb:217,138,78;
  --textPrimary:#F4EDE2; --textSecondary:#C9BCA6; --textHint:#8F8371;
  --btnText:#171310;
  color-scheme: dark;
}
[data-theme="navy"] {
  --pageBg:#F5EFEA; --cardBg:#EDE6DF; --inputBg:#E5DDD5; --hoverBg:#DDD4CB;
  --emphasis:#E8DFD6; --divider:#DDD4CB;
  --accent:#122E8A; --accentDark:#0E2470; --accentPressed:#0A1C58;
  --accent-rgb:18,46,138;
  --textPrimary:#122E8A; --textSecondary:#3E5299; --textHint:#7E8AB8;
  --btnText:#F5EFEA;
  color-scheme: light;
}
[data-theme="navy-dark"] {
  --pageBg:#0D1220; --cardBg:#141C2E; --inputBg:#1B2438; --hoverBg:#222D46;
  --emphasis:#1C2740; --divider:#2B3756;
  --accent:#6C8AE8; --accentDark:#5A78D8; --accentPressed:#4A66C4;
  --accent-rgb:108,138,232;
  --textPrimary:#E9EEFC; --textSecondary:#AFB9D6; --textHint:#7480A0;
  --btnText:#0D1220;
  color-scheme: dark;
}

:root {
  --sidebar-bg: var(--cardBg);
  --card-shadow: 0 1px 2px rgba(38,33,23,.04), 0 10px 30px rgba(38,33,23,.06);
  --card-shadow-hover: 0 1px 2px rgba(38,33,23,.05), 0 16px 36px rgba(38,33,23,.11);
}
[data-theme$="-dark"] {
  --card-shadow: 0 1px 2px rgba(0,0,0,.30), 0 12px 32px rgba(0,0,0,.28);
  --card-shadow-hover: 0 1px 2px rgba(0,0,0,.34), 0 18px 40px rgba(0,0,0,.40);
}

/* ============================================================================
   Layer 2 · 桥接令牌
   ============================================================================ */
:root {
  --radius-sm: 8px;
  --radius-md: 14px;
  --radius-lg: 20px;
  --radius-pill: 9999px;

  --sidebar-w: 260px;
  --sidebar-w-collapsed: 76px;

  --sp-1: 4px;  --sp-2: 8px;  --sp-3: 12px;
  --sp-4: 16px; --sp-5: 24px; --sp-6: 32px; --sp-7: 48px;

  --fs-h1: 34px;
  --fs-body: 16px;
  --fs-sub: 14px;
  --fs-small: 13px;
  --fs-tiny: 11px;

  --ease-out: cubic-bezier(0.23, 1, 0.32, 1);
  --dur: 200ms;
  --dur-fast: 140ms;
  --dur-slide: 450ms;
}

/* ============================================================================
   Layer 3 · 重置
   ============================================================================ */
*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

html {
  -webkit-text-size-adjust: 100%;
  -webkit-tap-highlight-color: transparent;
  -webkit-font-smoothing: antialiased;
  overscroll-behavior: none;
  scroll-behavior: smooth;
}

body {
  min-height: 100vh;
  min-height: 100dvh;
  color: var(--textPrimary);
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
               "Noto Sans SC", "PingFang SC", "Microsoft YaHei", sans-serif;
  font-size: var(--fs-body);
  line-height: 1.7;
  overflow-x: hidden;
  background:
    radial-gradient(50% 40% at 88% -8%, rgba(var(--accent-rgb), .10), transparent 62%),
    radial-gradient(44% 36% at 0% 104%, rgba(var(--accent-rgb), .06), transparent 62%),
    var(--pageBg);
  background-attachment: fixed;
  transition: background-color var(--dur) var(--ease-out),
              color var(--dur) var(--ease-out);
}
body.is-dragging {
  -webkit-user-select: none;
  user-select: none;
  cursor: grabbing;
}
body.is-dragging * { cursor: grabbing !important; }

a { color: inherit; text-decoration: none; }
img { display: block; max-width: 100%; }

button, a, select {
  touch-action: manipulation;
  -webkit-user-select: none;
  user-select: none;
  font-family: inherit;
  color: inherit;
}

::selection { background: rgba(var(--accent-rgb), .22); }

::-webkit-scrollbar { width: 6px; height: 6px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb {
  background: rgba(var(--accent-rgb), .32);
  border-radius: 999px;
}
::-webkit-scrollbar-thumb:hover { background: rgba(var(--accent-rgb), .55); }

:focus-visible {
  outline: 2px solid var(--accent);
  outline-offset: 2px;
  border-radius: var(--radius-sm);
}

/* ============================================================================
   Layer 4 · 骨架
   ============================================================================ */
.layout { display: flex; min-height: 100vh; min-height: 100dvh; }

.sb-backdrop {
  display: none; position: fixed; inset: 0;
  background: rgba(0,0,0,.38); z-index: 150;
  opacity: 0; pointer-events: none;
  transition: opacity 300ms var(--ease-out);
}
.sb-backdrop.visible { opacity: 1; pointer-events: auto; }

/* ------------------------------ 侧栏 ------------------------------ */
.sidebar {
  flex: 0 0 var(--sidebar-w); width: var(--sidebar-w);
  height: 100vh; height: 100dvh;
  position: sticky; top: 0; z-index: 100;
  display: flex; flex-direction: column; gap: var(--sp-2);
  padding: 24px 20px 20px;
  background: var(--sidebar-bg);
  border-right: 1px solid var(--divider);
  overflow: hidden;
  transition:
    flex-basis var(--dur-slide) var(--ease-out),
    width var(--dur-slide) var(--ease-out),
    padding var(--dur-slide) var(--ease-out),
    background-color var(--dur) var(--ease-out),
    border-color var(--dur) var(--ease-out);
}

.brand {
  position: relative; display: flex; align-items: center;
  flex-shrink: 0; width: 100%; height: 38px;
  padding: 0 4px; margin: 4px 0 30px;
  border: none; background: transparent; cursor: pointer;
  border-radius: var(--radius-sm);
  -webkit-tap-highlight-color: transparent;
  transition: background-color var(--dur-fast) var(--ease-out);
}
.brand::after {
  content: ''; position: absolute;
  left: 0; right: 0; bottom: -16px; height: 1px;
  background: var(--divider);
  transition: background-color var(--dur) var(--ease-out);
}

.brand-arrow {
  position: absolute; left: 50%; top: 50%;
  width: 34px; height: 34px;
  display: inline-flex; align-items: center; justify-content: center;
  border-radius: 9px;
  color: var(--textSecondary);
  background: transparent;
  transform: translate(-50%, -50%);
  opacity: 1;
  transition: opacity 160ms var(--ease-out),
              transform 340ms var(--ease-out),
              color var(--dur-fast) var(--ease-out),
              background-color var(--dur-fast) var(--ease-out);
}
.brand-arrow svg { display: block; }

.brand-main {
  display: flex; align-items: center; gap: 12px;
  min-width: 0; max-width: 0; opacity: 0;
  overflow: hidden; white-space: nowrap;
  transition: max-width var(--dur-slide) var(--ease-out),
              opacity 160ms var(--ease-out);
}
.brand-mark {
  flex: 0 0 auto; width: 38px; height: 38px;
  border-radius: 11px;
  display: grid; place-items: center;
  background: var(--accent); color: var(--btnText);
  font-size: 20px; font-weight: 600; line-height: 1;
  box-shadow: 0 4px 14px rgba(var(--accent-rgb), .28);
  cursor: pointer;
  transition: background-color var(--dur-fast) var(--ease-out),
              transform var(--dur-fast) var(--ease-out);
}
.brand-mark:hover { background: var(--accentDark); }
.brand-mark:active { transform: scale(.93); }
.brand-text { display: flex; flex-direction: column; min-width: 0; line-height: 1.4; }
.brand-name {
  font-size: var(--fs-small); font-weight: 700;
  letter-spacing: .02em; color: var(--textPrimary); white-space: nowrap;
}
.brand-sub {
  font-size: var(--fs-tiny); color: var(--textHint);
  letter-spacing: .16em; text-transform: uppercase; white-space: nowrap;
}

.sidebar[data-collapsed="false"] .brand-arrow {
  opacity: 0;
  transform: translate(calc(-50% - 22px), -50%) scale(.65);
  pointer-events: none;
}
.sidebar[data-collapsed="false"] .brand-main {
  max-width: 220px; opacity: 1;
  transition: max-width var(--dur-slide) var(--ease-out),
              opacity 240ms var(--ease-out) 190ms;
}
.sidebar[data-collapsed="true"] .brand-arrow {
  transition: opacity 180ms var(--ease-out) 150ms,
              transform 340ms var(--ease-out) 110ms,
              color var(--dur-fast) var(--ease-out),
              background-color var(--dur-fast) var(--ease-out);
}

/* ------------------------------ 侧栏面板 ------------------------------ */
.sidebar-nav {
  position: relative;
  flex: 1; min-height: 0;
  overflow: hidden;
}

.nav-panel {
  position: absolute;
  inset: 0;
  display: flex;
  flex-direction: column;
  gap: 2px;
  overflow-y: auto;
  overflow-x: hidden;
  padding-right: 1px;
  visibility: hidden;
  opacity: 0;
  pointer-events: none;
  transform: translateX(100%);
  transition:
    transform 340ms var(--ease-out),
    opacity 260ms var(--ease-out),
    visibility 0s 340ms;
}
.nav-panel[data-state="active"] {
  visibility: visible;
  opacity: 1;
  pointer-events: auto;
  transform: translateX(0);
  transition:
    transform 340ms var(--ease-out),
    opacity 260ms var(--ease-out),
    visibility 0s;
}
.nav-panel[data-state="left"] {
  visibility: hidden;
  opacity: 0;
  pointer-events: none;
  transform: translateX(-100%);
  transition:
    transform 340ms var(--ease-out),
    opacity 260ms var(--ease-out),
    visibility 0s 340ms;
}

.nav-panel-title {
  flex-shrink: 0;
  padding: 2px 14px 8px;
  font-size: var(--fs-tiny);
  font-weight: 700;
  letter-spacing: .18em;
  text-transform: uppercase;
  color: var(--textHint);
  white-space: nowrap;
}
.nav-panel-title.memo-gap { margin-top: 14px; }

.cat-list,
.memo-list {
  display: flex;
  flex-direction: column;
  gap: 2px;
}

.nav-item {
  position: relative; display: flex; align-items: center; gap: 12px;
  padding: 11px 14px;
  border: 0;
  background: transparent;
  border-radius: var(--radius-sm);
  font-size: var(--fs-sub); font-weight: 500;
  color: var(--textSecondary);
  cursor: pointer;
  text-align: left;
  width: 100%;
  -webkit-touch-callout: none;
  transition: background-color var(--dur-fast) var(--ease-out),
              color var(--dur-fast) var(--ease-out),
              outline-color var(--dur-fast) var(--ease-out);
}
.nav-icon {
  width: 20px; flex: 0 0 auto; text-align: center;
  font-size: 15px; color: var(--textHint);
  transition: color var(--dur-fast) var(--ease-out);
}
.nav-item.active {
  background: var(--emphasis); color: var(--accent); font-weight: 700;
}
.nav-item.active::before {
  content: ''; position: absolute;
  left: 0; top: 50%; transform: translateY(-50%);
  width: 3px; height: 18px;
  border-radius: 0 3px 3px 0;
  background: var(--accent);
}
.nav-item.active .nav-icon { color: var(--accent); }

.cat-icon { color: var(--accent); font-size: 13px; }
.memo-icon { font-size: 15px; }

.nav-chevron {
  margin-left: auto;
  font-size: 15px;
  line-height: 1;
  color: var(--textHint);
  transition: color var(--dur-fast) var(--ease-out),
              transform var(--dur-fast) var(--ease-out);
}
.nav-item.has-children:hover .nav-chevron { color: var(--accent); transform: translateX(2px); }

.nav-item.go-back {
  color: var(--textHint);
  font-size: var(--fs-small);
  margin-bottom: 2px;
}
.nav-item.go-back .nav-icon { font-size: 17px; }

.nav-label {
  display: flex;
  flex-direction: column;
  min-width: 0;
  max-width: 220px;
  line-height: 1.35;
  gap: 2px;
  overflow: hidden;
  opacity: 1;
  transition: opacity 220ms var(--ease-out),
              max-width var(--dur-slide) var(--ease-out);
}
.memo-item-title {
  font-size: var(--fs-sub);
  font-weight: 600;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.memo-item-date {
  font-size: var(--fs-tiny);
  font-weight: 400;
  letter-spacing: .04em;
  color: var(--textHint);
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.panel-empty {
  padding: 12px 14px;
  font-size: var(--fs-small);
  color: var(--textHint);
}

.nav-item.drop-hover {
  background: rgba(var(--accent-rgb), .22);
  color: var(--accent);
  outline: 2px dashed rgba(var(--accent-rgb), .55);
  outline-offset: -2px;
}

.sidebar-foot {
  flex-shrink: 0; padding-top: var(--sp-4);
  border-top: 1px solid var(--divider);
  transition: border-color var(--dur) var(--ease-out),
              padding var(--dur-slide) var(--ease-out);
}

.theme-toggle {
  width: 100%; display: flex; align-items: center; gap: 10px;
  padding: 10px 13px;
  border-radius: var(--radius-sm);
  border: 1px solid var(--divider);
  background: transparent;
  color: var(--textSecondary);
  font-size: var(--fs-small); font-weight: 500;
  white-space: nowrap; cursor: pointer;
  transition: border-color var(--dur-fast) var(--ease-out),
              color var(--dur-fast) var(--ease-out),
              background-color var(--dur-fast) var(--ease-out),
              padding var(--dur-slide) var(--ease-out);
}
.theme-icon { font-size: 14px; line-height: 1; flex: 0 0 auto; }
.theme-toggle[aria-pressed="true"] {
  color: var(--accent);
  border-color: rgba(var(--accent-rgb), .45);
}
.theme-text {
  max-width: 220px; overflow: hidden; opacity: 1;
  transition: opacity 220ms var(--ease-out),
              max-width var(--dur-slide) var(--ease-out);
}

.sidebar[data-collapsed="true"] {
  flex: 0 0 var(--sidebar-w-collapsed);
  width: var(--sidebar-w-collapsed);
  padding: 24px 10px 16px;
  align-items: center;
}
.sidebar[data-collapsed="true"] .brand { justify-content: center; padding: 0; }
.sidebar[data-collapsed="true"] .brand::after { left: 4px; right: 4px; }
.sidebar[data-collapsed="true"] .sidebar-nav { width: 100%; }
.sidebar[data-collapsed="true"] .nav-panel { padding-right: 0; }
.sidebar[data-collapsed="true"] .nav-panel-title { display: none; }
.sidebar[data-collapsed="true"] .nav-item {
  justify-content: center; gap: 0; padding: 11px 0;
}
.sidebar[data-collapsed="true"] .nav-label { opacity: 0; max-width: 0; pointer-events: none; }
.sidebar[data-collapsed="true"] .nav-icon { width: auto; }
.sidebar[data-collapsed="true"] .nav-chevron { display: none; }
.sidebar[data-collapsed="true"] .nav-item.active::before { opacity: 0; }
.sidebar[data-collapsed="true"] .sidebar-foot { width: 100%; }
.sidebar[data-collapsed="true"] .theme-toggle { justify-content: center; padding: 10px 0; gap: 0; }
.sidebar[data-collapsed="true"] .theme-text { opacity: 0; max-width: 0; pointer-events: none; }

/* ------------------------------ 主区域 ------------------------------ */
.main {
  flex: 1; min-width: 0;
  display: flex; justify-content: center;
  padding: 96px 40px 120px;
}
.main-inner { width: 100%; max-width: 820px; }

.toolbar {
  display: flex; flex-wrap: wrap; gap: 10px; align-items: center;
  padding: 10px 12px; margin-bottom: 28px;
  border-radius: var(--radius-md);
  background: var(--cardBg);
  border: 1px solid var(--divider);
  box-shadow: var(--card-shadow);
  transition: background-color var(--dur) var(--ease-out),
              border-color var(--dur) var(--ease-out),
              box-shadow var(--dur) var(--ease-out);
}
.toolbar-label {
  font-size: var(--fs-tiny); color: var(--textHint);
  letter-spacing: .06em;
}
.toolbar-select {
  height: 34px; padding: 0 12px;
  border: none; outline: none;
  border-radius: var(--radius-pill);
  background: var(--inputBg);
  color: var(--textPrimary);
  font-size: var(--fs-small); cursor: pointer;
}
.toolbar-count {
  margin-left: auto;
  font-size: var(--fs-tiny);
  color: var(--textHint);
  letter-spacing: .06em;
}

/* ------------------------------ 视图容器 ------------------------------ */
.memo-view {
  animation: rise .4s var(--ease-out) both;
}
.memo-view[hidden] { display: none; }

/* ------------------------------ 列表：正方形网格 ------------------------------ */
.memo-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
  gap: 14px;
}

.memo-card {
  position: relative;
  aspect-ratio: 1 / 1;
  display: flex;
  flex-direction: column;
  padding: 16px;
  border-radius: var(--radius-md);
  border: 1px solid var(--divider);
  background: var(--cardBg);
  color: var(--textPrimary);
  box-shadow: var(--card-shadow);
  cursor: pointer;
  text-align: left;
  overflow: hidden;
  transition: transform 200ms var(--ease-out),
              box-shadow 200ms var(--ease-out),
              border-color 200ms var(--ease-out),
              background-color 200ms var(--ease-out);
}
.memo-card:active { transform: scale(.98); }

.memo-card-title {
  flex-shrink: 0;
  font-size: 15px;
  font-weight: 700;
  line-height: 1.4;
  color: var(--textPrimary);
  overflow: hidden;
  display: -webkit-box;
  -webkit-line-clamp: 2;
  -webkit-box-orient: vertical;
  word-break: break-word;
}
.memo-card-date {
  flex-shrink: 0;
  margin-top: 4px;
  font-size: var(--fs-tiny);
  letter-spacing: .04em;
  color: var(--textHint);
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.memo-card-preview {
  flex: 1;
  min-height: 0;
  margin-top: 10px;
  font-size: 12px;
  line-height: 1.55;
  color: var(--textSecondary);
  overflow: hidden;
  -webkit-mask-image: linear-gradient(to bottom, #000 55%, transparent 100%);
          mask-image: linear-gradient(to bottom, #000 55%, transparent 100%);
}

.grid-empty {
  padding: 40px 0;
  text-align: center;
  font-size: var(--fs-small);
  color: var(--textHint);
}

/* ------------------------------ 详情：纯文字占满 ------------------------------ */
.detail-back {
  display: inline-flex; align-items: center; gap: 4px;
  padding: 4px 0;
  margin-bottom: 28px;
  border: 0;
  background: transparent;
  color: var(--textHint);
  font-size: var(--fs-small);
  letter-spacing: .04em;
  cursor: pointer;
  transition: color var(--dur-fast) var(--ease-out);
}
.detail-back:hover { color: var(--accent); }

.detail-paper { width: 100%; }

.detail-title {
  font-size: 30px;
  font-weight: 800;
  line-height: 1.3;
  letter-spacing: .01em;
  color: var(--textPrimary);
  overflow-wrap: anywhere;
}
.detail-date {
  margin-top: 10px;
  font-size: var(--fs-tiny);
  letter-spacing: .14em;
  text-transform: uppercase;
  color: var(--textHint);
}

.detail-rule {
  height: 1px;
  margin: 22px 0 26px;
  background: var(--divider);
}

.detail-body {
  white-space: pre-wrap;
  overflow-wrap: anywhere;
  font-size: 16px;
  line-height: 1.95;
  color: var(--textPrimary);
}

@keyframes rise {
  from { opacity: 0; transform: translateY(10px); }
  to   { opacity: 1; transform: none; }
}

/* ------------------------------ FAB ------------------------------ */
.fab {
  position: fixed;
  right: 28px; bottom: 28px;
  z-index: 400;
  width: 56px; height: 56px;
  border-radius: 50%;
  border: 0;
  background: var(--accent);
  color: var(--btnText);
  font-size: 26px;
  font-weight: 400;
  line-height: 1;
  display: grid; place-items: center;
  cursor: pointer;
  box-shadow: 0 10px 28px rgba(var(--accent-rgb), .38);
  transition: transform .16s var(--ease-out),
              background-color .16s var(--ease-out),
              box-shadow .16s var(--ease-out);
}
.fab:hover {
  background: var(--accentDark);
  transform: translateY(-2px);
  box-shadow: 0 14px 32px rgba(var(--accent-rgb), .45);
}
.fab:active { transform: scale(.94); }

/* ------------------------------ 拖拽幽灵 ------------------------------ */
.drag-ghost {
  position: fixed; left: 0; top: 0; z-index: 9999;
  pointer-events: none;
  display: inline-flex; align-items: center; gap: 10px;
  padding: 10px 16px;
  border-radius: var(--radius-md);
  background: var(--cardBg);
  color: var(--textPrimary);
  border: 1px solid var(--divider);
  box-shadow: 0 12px 32px rgba(0,0,0,.22);
  font-size: var(--fs-sub); font-weight: 600;
  white-space: nowrap;
  max-width: 260px;
  opacity: .96;
  transform: translate(-9999px, -9999px);
}
.drag-ghost-icon { color: var(--accent); flex: 0 0 auto; }
.drag-ghost-label { overflow: hidden; text-overflow: ellipsis; }

/* ------------------------------ 弹窗 ------------------------------ */
.modal-backdrop {
  position: fixed; inset: 0; z-index: 800;
  display: grid; place-items: center;
  padding: 20px;
  background: rgba(0,0,0,.42);
  opacity: 0; pointer-events: none;
  transition: opacity .2s var(--ease-out);
}
.modal-backdrop.open { opacity: 1; pointer-events: auto; }

.modal {
  width: min(100%, 420px);
  background: var(--cardBg);
  border: 1px solid var(--divider);
  border-radius: var(--radius-lg);
  box-shadow: 0 24px 60px rgba(0,0,0,.28);
  padding: 24px;
  transform: translateY(10px) scale(.98);
  transition: transform .22s var(--ease-out);
}
.modal-backdrop.open .modal { transform: none; }

.modal-title {
  font-size: 18px;
  font-weight: 800;
  margin-bottom: 18px;
  color: var(--textPrimary);
}
.modal-field { display: block; margin-bottom: 14px; }
.modal-field > span {
  display: block;
  font-size: var(--fs-tiny);
  color: var(--textHint);
  letter-spacing: .1em;
  margin-bottom: 6px;
}
.modal-field input,
.modal-field textarea {
  width: 100%;
  background: var(--inputBg);
  color: var(--textPrimary);
  border: 1px solid var(--divider);
  border-radius: var(--radius-sm);
  padding: 10px 12px;
  font: inherit;
  font-size: var(--fs-sub);
  outline: none;
  resize: vertical;
  transition: border-color var(--dur-fast) var(--ease-out);
}
.modal-field input:focus,
.modal-field textarea:focus { border-color: var(--accent); }

.modal-actions {
  display: flex; justify-content: flex-end; gap: 10px;
  margin-top: 20px;
}
.modal-btn {
  height: 38px; padding: 0 18px;
  border-radius: var(--radius-pill);
  border: 1px solid var(--divider);
  background: transparent;
  font: inherit; font-size: var(--fs-sub); font-weight: 600;
  cursor: pointer;
  transition: background-color .14s var(--ease-out),
              color .14s var(--ease-out),
              border-color .14s var(--ease-out);
}
.modal-btn.primary {
  background: var(--accent);
  color: var(--btnText);
  border-color: transparent;
}
.modal-btn.primary:hover { background: var(--accentDark); }
.modal-btn.ghost:hover {
  border-color: rgba(var(--accent-rgb), .45);
  color: var(--accent);
}

/* ============================================================================
   Layer 5 · 悬停
   ============================================================================ */
@media (hover: hover) and (pointer: fine) {
  .sidebar[data-collapsed="true"] .brand:hover .brand-arrow {
    color: var(--accent); background: var(--emphasis);
  }
  .sidebar[data-collapsed="false"] .brand:hover { background: var(--emphasis); }
  .nav-item:hover { background: var(--emphasis); color: var(--textPrimary); }
  .nav-item:hover .nav-icon { color: var(--accent); }
  .theme-toggle:hover {
    border-color: rgba(var(--accent-rgb), .45);
    color: var(--accent);
  }
  .memo-card:hover {
    transform: translateY(-2px);
    box-shadow: var(--card-shadow-hover);
    border-color: rgba(var(--accent-rgb), .38);
    background: var(--emphasis);
  }
}

/* ============================================================================
   Layer 6 · 响应式
   ============================================================================ */
@media (max-width: 860px) {
  .sb-backdrop { display: block; }
  .main { padding: 64px 20px 96px 96px; }
  .sidebar {
    position: fixed; left: 0; top: 0;
    height: 100dvh; flex: none;
    width: var(--sidebar-w-collapsed);
    padding: 24px 10px 16px; align-items: center;
    z-index: 200;
  }
  .sidebar[data-collapsed="false"] {
    width: var(--sidebar-w); padding: 24px 20px 20px;
    align-items: stretch; z-index: 1000;
    box-shadow: 0 0 44px rgba(0,0,0,.26);
  }
  .memo-grid {
    grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
    gap: 12px;
  }
  .detail-title { font-size: 25px; }
  .detail-body { font-size: 15px; }
  .fab { right: 18px; bottom: 18px; width: 52px; height: 52px; font-size: 24px; }
}

@media (max-width: 520px) {
  .main { padding: 56px 14px 88px 88px; }
  .memo-grid {
    grid-template-columns: repeat(auto-fill, minmax(125px, 1fr));
    gap: 10px;
  }
  .memo-card { padding: 13px; }
  .memo-card-title { font-size: 14px; }
  .memo-card-preview { font-size: 11.5px; }
  .detail-title { font-size: 22px; }
  .detail-body { font-size: 14.5px; line-height: 1.85; }
}

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation-duration: .001ms !important;
    transition-duration: .001ms !important;
    scroll-behavior: auto !important;
  }
}
</style>
</head>
<body>

<div class="layout">

  <div class="sb-backdrop" id="sbBackdrop" aria-hidden="true"></div>

  <!-- ============================ 侧栏 ============================ -->
  <aside class="sidebar" id="sidebar" data-collapsed="false">

    <button class="brand" id="brandToggle" type="button"
            aria-expanded="true" aria-controls="sidebarNav"
            aria-label="收起侧栏" title="收起侧栏">

      <span class="brand-arrow" aria-hidden="true">
        <svg viewBox="0 0 24 24" width="16" height="16"
             fill="none" stroke="currentColor"
             stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="9 18 15 12 9 6"/>
        </svg>
      </span>

      <span class="brand-main">
        <span class="brand-mark" id="addCategoryBtn" role="button" tabindex="0"
              aria-label="新建大分类" title="新建大分类">+</span>
        <span class="brand-text">
          <span class="brand-name">备忘录</span>
          <span class="brand-sub">MEMO NOTES</span>
        </span>
      </span>
    </button>

    <nav class="sidebar-nav" id="sidebarNav">
      <div class="nav-panel" data-panel="root" data-state="active">
        <p class="nav-panel-title">大分类</p>
        <div class="cat-list" id="catList"></div>

        <p class="nav-panel-title memo-gap">备忘录</p>
        <div class="memo-list" id="memoRootList"></div>
      </div>
      <!-- 分类面板由脚本动态生成 -->
    </nav>

    <div class="sidebar-foot">
      <button class="theme-toggle" id="themeToggle" aria-pressed="false" aria-label="切换深浅色">
        <span class="theme-icon">☾</span>
        <span class="theme-text">深色模式</span>
      </button>
    </div>
  </aside>

  <!-- ============================ 主区域 ============================ -->
  <main class="main">
    <div class="main-inner">

      <div class="toolbar">
        <label class="toolbar-label" for="themeSelect">主题</label>
        <select id="themeSelect" class="toolbar-select" aria-label="主题">
          <option value="reset">暖铜</option>
          <option value="reset-dark">暖铜 · 深</option>
          <option value="navy">深海军蓝</option>
          <option value="navy-dark">深海军蓝 · 深</option>
        </select>
        <span class="toolbar-count" id="memoCount">共 0 条</span>
      </div>

      <!-- ========== 列表视图：正方形网格 ========== -->
      <section class="memo-view" id="listView">
        <div class="memo-grid" id="memoGrid"></div>
      </section>

      <!-- ========== 详情视图：纯文字占满主区域 ========== -->
      <article class="memo-view" id="detailView" hidden>
        <button type="button" class="detail-back" id="detailBack">← 返回列表</button>

        <div class="detail-paper">
          <h1 class="detail-title" id="detailTitle"></h1>
          <p class="detail-date" id="detailDate"></p>
          <div class="detail-rule"></div>
          <div class="detail-body" id="detailBody"></div>
        </div>
      </article>

    </div>
  </main>

</div>

<!-- 右下角新建备忘录 -->
<button class="fab" id="fabAdd" type="button" aria-label="新建备忘录" title="新建备忘录">+</button>

<!-- 弹窗 -->
<div class="modal-backdrop" id="modalBackdrop" aria-hidden="true">
  <div class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
    <h2 class="modal-title" id="modalTitle">新建</h2>

    <label class="modal-field">
      <span id="modalNameLabel">标题</span>
      <input id="modalNameInput" type="text" autocomplete="off" />
    </label>

    <label class="modal-field" id="modalBodyField">
      <span>正文</span>
      <textarea id="modalBodyInput" rows="6"></textarea>
    </label>

    <div class="modal-actions">
      <button type="button" class="modal-btn ghost" id="modalCancel">取消</button>
      <button type="button" class="modal-btn primary" id="modalConfirm">确认</button>
    </div>
  </div>
</div>

<!-- ============================================================
     脚本
     ============================================================ -->
<script>
(function () {
  'use strict';

  /* ============================================================
     ① 数据 —— 存 localStorage，刷新不丢
     ============================================================ */
  var STORE_KEY = 'swfb-memo-data-v1';

  /* 首次使用的示例数据（只作种子，用完即弃） */
  var SEED_CATEGORIES = [
    { id: 'cat-work', name: '工作' },
    { id: 'cat-life', name: '生活' }
  ];

  var SEED_MEMOS = [
    {
      id: 'memo-1',
      title: '欢迎使用备忘录',
      date: '2026-10-30',
      body: '这是空壳子里的示例内容。\n\n主页面把每条备忘录显示成一个正方形小卡片，点任意一张卡片，整个主区域就换成纯文字详情。\n\n侧栏点某条备忘录，也会直接打开它的全文。\n\n点右下角的「+」新建备忘录，点侧栏左上角的「+」新建大分类。\n\n长按侧栏里的备忘录，可以把它拖到大分类里。\n\n关注春暖花开喵～',
      category: null
    }
  ];

  /* 读取本地存档；无存档或数据结构不对都返回 null */
  function loadStore() {
    try {
      var raw = localStorage.getItem(STORE_KEY);
      if (!raw) return null;
      var data = JSON.parse(raw);
      if (!data || !Array.isArray(data.categories) || !Array.isArray(data.memos)) return null;
      return data;
    } catch (e) {
      return null;
    }
  }

  var storedData = loadStore();

  var CATEGORIES = storedData
    ? storedData.categories
    : JSON.parse(JSON.stringify(SEED_CATEGORIES));

  var MEMOS = storedData
    ? storedData.memos
    : JSON.parse(JSON.stringify(SEED_MEMOS));

  /* 写入本地存档 */
  function saveStore() {
    try {
      localStorage.setItem(STORE_KEY, JSON.stringify({
        categories: CATEGORIES,
        memos: MEMOS
      }));
      return true;
    } catch (e) {
      return false;   /* 隐私模式 / 容量满，当前会话内仍可用 */
    }
  }

  /* ============================================================
     ② DOM
     ============================================================ */
  var $ = function (id) { return document.getElementById(id); };

  var sidebar = $('sidebar');
  var sidebarNav = $('sidebarNav');
  var brandBtn = $('brandToggle');
  var addCategoryBtn = $('addCategoryBtn');
  var backdrop = $('sbBackdrop');
  var catListEl = $('catList');
  var memoRootListEl = $('memoRootList');
  var memoCountEl = $('memoCount');

  var listView = $('listView');
  var detailView = $('detailView');
  var memoGrid = $('memoGrid');
  var detailBack = $('detailBack');
  var detailTitle = $('detailTitle');
  var detailDate = $('detailDate');
  var detailBody = $('detailBody');

  var themeSelect = $('themeSelect');
  var themeBtn = $('themeToggle');
  var themeText = themeBtn.querySelector('.theme-text');
  var themeIcon = themeBtn.querySelector('.theme-icon');
  var meta = document.querySelector('meta[name="theme-color"]');

  var modalBackdrop = $('modalBackdrop');
  var modalTitle = $('modalTitle');
  var modalNameLabel = $('modalNameLabel');
  var modalNameInput = $('modalNameInput');
  var modalBodyField = $('modalBodyField');
  var modalBodyInput = $('modalBodyInput');
  var modalCancel = $('modalCancel');
  var modalConfirm = $('modalConfirm');

  var fabAdd = $('fabAdd');

  var SB_KEY = 'swfb-sidebar-collapsed';
  var currentId = null;
  var activePanelName = 'root';
  var suppressClick = false;

  /* ============================================================
     ③ 工具
     ============================================================ */
  function pad2(n) { return n < 10 ? '0' + n : String(n); }

  function todayStr() {
    var d = new Date();
    return d.getFullYear() + '-' + pad2(d.getMonth() + 1) + '-' + pad2(d.getDate());
  }

  function findMemo(id) {
    for (var i = 0; i < MEMOS.length; i++) {
      if (MEMOS[i].id === id) return MEMOS[i];
    }
    return null;
  }

  function findCategory(id) {
    for (var i = 0; i < CATEGORIES.length; i++) {
      if (CATEGORIES[i].id === id) return CATEGORIES[i];
    }
    return null;
  }

  /* ============================================================
     ④ 面板切换
     ============================================================ */
  function openPanel(name) {
    var panels = sidebarNav.querySelectorAll('.nav-panel');
    var exists = false;

    Array.prototype.forEach.call(panels, function (p) {
      if (p.getAttribute('data-panel') === name) exists = true;
    });
    if (!exists) name = 'root';

    activePanelName = name;

    Array.prototype.forEach.call(panels, function (p) {
      var key = p.getAttribute('data-panel');
      if (key === name) {
        p.setAttribute('data-state', 'active');
        p.removeAttribute('aria-hidden');
        p.removeAttribute('inert');
      } else {
        p.setAttribute('data-state', key === 'root' ? 'left' : 'right');
        p.setAttribute('aria-hidden', 'true');
        p.setAttribute('inert', '');
      }
    });
  }

  /* ============================================================
     ⑤ 渲染侧栏
     ============================================================ */
  function buildMemoItem(memo, draggable) {
    var btn = document.createElement('button');
    btn.type = 'button';
    btn.className = 'nav-item memo-item';
    btn.setAttribute('data-memo-id', memo.id);
    btn.title = memo.title;

    var icon = document.createElement('span');
    icon.className = 'nav-icon memo-icon';
    icon.textContent = '□';

    var label = document.createElement('span');
    label.className = 'nav-label';

    var t = document.createElement('span');
    t.className = 'memo-item-title';
    t.textContent = memo.title;

    var d = document.createElement('span');
    d.className = 'memo-item-date';
    d.textContent = memo.date || '';

    label.appendChild(t);
    label.appendChild(d);

    btn.appendChild(icon);
    btn.appendChild(label);

    if (memo.id === currentId) btn.classList.add('active');

    btn.addEventListener('click', function () {
      if (suppressClick) return;
      showDetail(memo.id);
    });

    if (draggable) bindDrag(btn, memo);

    return btn;
  }

  function buildCategoryItem(cat) {
    var btn = document.createElement('button');
    btn.type = 'button';
    btn.className = 'nav-item has-children cat-item';
    btn.setAttribute('data-cat-drop', cat.id);
    btn.title = '打开「' + cat.name + '」';

    var icon = document.createElement('span');
    icon.className = 'nav-icon cat-icon';
    icon.textContent = '●';

    var label = document.createElement('span');
    label.className = 'nav-label';

    var t = document.createElement('span');
    t.className = 'memo-item-title';
    t.textContent = cat.name;

    label.appendChild(t);

    var chevron = document.createElement('span');
    chevron.className = 'nav-chevron';
    chevron.setAttribute('aria-hidden', 'true');
    chevron.textContent = '›';

    btn.appendChild(icon);
    btn.appendChild(label);
    btn.appendChild(chevron);

    btn.addEventListener('click', function () {
      if (suppressClick) return;
      if (sidebar.getAttribute('data-collapsed') === 'true') {
        applySidebar(false);
        try { localStorage.setItem(SB_KEY, 'false'); } catch (e) {}
      }
      openPanel('cat:' + cat.id);
    });

    return btn;
  }

  function renderSidebar() {
    /* 根面板：大分类 */
    catListEl.innerHTML = '';
    CATEGORIES.forEach(function (cat) {
      catListEl.appendChild(buildCategoryItem(cat));
    });

    /* 根面板：未分类备忘录 */
    memoRootListEl.innerHTML = '';
    var uncategorized = MEMOS.filter(function (m) { return !m.category; });
    if (uncategorized.length === 0) {
      var empty = document.createElement('p');
      empty.className = 'panel-empty';
      empty.textContent = '没有未分类的备忘录';
      memoRootListEl.appendChild(empty);
    } else {
      uncategorized.forEach(function (memo) {
        memoRootListEl.appendChild(buildMemoItem(memo, true));
      });
    }

    /* 移除旧的分类面板 */
    Array.prototype.slice.call(
      sidebarNav.querySelectorAll('.nav-panel[data-panel^="cat:"]')
    ).forEach(function (p) { p.remove(); });

    /* 生成分类面板 */
    CATEGORIES.forEach(function (cat) {
      var panel = document.createElement('div');
      panel.className = 'nav-panel';
      panel.setAttribute('data-panel', 'cat:' + cat.id);
      panel.setAttribute('data-state', 'right');
      panel.setAttribute('aria-hidden', 'true');
      panel.setAttribute('inert', '');

      var back = document.createElement('button');
      back.type = 'button';
      back.className = 'nav-item go-back';
      var backIcon = document.createElement('span');
      backIcon.className = 'nav-icon';
      backIcon.textContent = '‹';
      var backLabel = document.createElement('span');
      backLabel.className = 'nav-label';
      backLabel.textContent = '返回';
      back.appendChild(backIcon);
      back.appendChild(backLabel);
      back.addEventListener('click', function () { openPanel('root'); });

      var title = document.createElement('p');
      title.className = 'nav-panel-title';
      title.textContent = cat.name;

      var list = document.createElement('div');
      list.className = 'memo-list';

      var items = MEMOS.filter(function (m) { return m.category === cat.id; });
      if (items.length === 0) {
        var emptyCat = document.createElement('p');
        emptyCat.className = 'panel-empty';
        emptyCat.textContent = '还没有备忘录';
        list.appendChild(emptyCat);
      } else {
        items.forEach(function (memo) {
          list.appendChild(buildMemoItem(memo, false));
        });
      }

      panel.appendChild(back);
      panel.appendChild(title);
      panel.appendChild(list);
      sidebarNav.appendChild(panel);
    });

    memoCountEl.textContent = '共 ' + MEMOS.length + ' 条';

    openPanel(activePanelName);
  }

  /* ============================================================
     ⑥ 主区域：正方形网格列表
     ============================================================ */
  function renderGrid() {
    memoGrid.innerHTML = '';

    if (MEMOS.length === 0) {
      var empty = document.createElement('div');
      empty.className = 'grid-empty';
      empty.textContent = '还没有备忘录，点右下角的「+」新建一条。';
      memoGrid.appendChild(empty);
      return;
    }

    MEMOS.forEach(function (memo) {
      var card = document.createElement('button');
      card.type = 'button';
      card.className = 'memo-card';
      card.setAttribute('data-memo-id', memo.id);

      var title = document.createElement('div');
      title.className = 'memo-card-title';
      title.textContent = memo.title;

      var date = document.createElement('div');
      date.className = 'memo-card-date';
      var cat = memo.category ? findCategory(memo.category) : null;
      var parts = [];
      if (memo.date) parts.push(memo.date);
      parts.push(cat ? cat.name : '未分类');
      date.textContent = parts.join(' · ');

      var preview = document.createElement('div');
      preview.className = 'memo-card-preview';
      preview.textContent = (memo.body || '').replace(/\s+/g, ' ').trim();

      card.appendChild(title);
      card.appendChild(date);
      card.appendChild(preview);

      card.addEventListener('click', function () {
        showDetail(memo.id);
      });

      memoGrid.appendChild(card);
    });
  }

  /* ============================================================
     ⑦ 主区域：纯文字详情
     ============================================================ */
  function showDetail(id) {
    var memo = findMemo(id);
    if (!memo) { showList(); return; }

    currentId = memo.id;

    detailTitle.textContent = memo.title;
    detailDate.textContent = memo.date || '';
    detailBody.textContent = memo.body || '';

    listView.hidden = true;
    detailView.hidden = false;

    /* 回顶部 */
    window.scrollTo({ top: 0, behavior: 'auto' });
    try { document.documentElement.scrollTop = 0; } catch (e) {}

    highlightSidebar();
  }

  function showList() {
    currentId = null;
    listView.hidden = false;
    detailView.hidden = true;
    window.scrollTo({ top: 0, behavior: 'auto' });
    highlightSidebar();
  }

  function highlightSidebar() {
    var items = sidebarNav.querySelectorAll('.memo-item');
    Array.prototype.forEach.call(items, function (el) {
      el.classList.toggle('active', el.getAttribute('data-memo-id') === currentId);
    });
  }

  detailBack.addEventListener('click', showList);

  /* ============================================================
     ⑧ 长按拖拽
     ============================================================ */
  var dragState = null;

  function preventScroll(e) {
    if (e.cancelable) e.preventDefault();
  }

  function startDrag(el, memo, x, y) {
    dragState = { memo: memo, el: el, ghost: null };
    document.body.classList.add('is-dragging');

    var ghost = document.createElement('div');
    ghost.className = 'drag-ghost';

    var icon = document.createElement('span');
    icon.className = 'drag-ghost-icon';
    icon.textContent = '□';

    var label = document.createElement('span');
    label.className = 'drag-ghost-label';
    label.textContent = memo.title;

    ghost.appendChild(icon);
    ghost.appendChild(label);
    document.body.appendChild(ghost);

    dragState.ghost = ghost;
    updateGhost(x, y);

    document.addEventListener('touchmove', preventScroll, { passive: false });

    if (navigator.vibrate) {
      try { navigator.vibrate(12); } catch (e) {}
    }
  }

  function updateGhost(x, y) {
    if (!dragState || !dragState.ghost) return;
    dragState.ghost.style.transform =
      'translate(' + (x + 14) + 'px,' + (y + 14) + 'px)';
  }

  function updateHover(x, y) {
    var target = document.elementFromPoint(x, y);
    var catEl = target && target.closest
      ? target.closest('[data-cat-drop]')
      : null;

    var prev = document.querySelectorAll('.drop-hover');
    Array.prototype.forEach.call(prev, function (el) {
      if (el !== catEl) el.classList.remove('drop-hover');
    });

    if (catEl && !catEl.classList.contains('drop-hover')) {
      catEl.classList.add('drop-hover');
    }
  }

  function cleanupDrag() {
    if (dragState && dragState.ghost && dragState.ghost.parentNode) {
      dragState.ghost.parentNode.removeChild(dragState.ghost);
    }
    dragState = null;

    document.body.classList.remove('is-dragging');
    document.removeEventListener('touchmove', preventScroll);

    var hovered = document.querySelectorAll('.drop-hover');
    Array.prototype.forEach.call(hovered, function (el) {
      el.classList.remove('drop-hover');
    });
  }

  function finishDrag(x, y) {
    var target = document.elementFromPoint(x, y);
    var catEl = target && target.closest
      ? target.closest('[data-cat-drop]')
      : null;
    var catId = catEl ? catEl.getAttribute('data-cat-drop') : null;
    var memo = dragState ? dragState.memo : null;

    cleanupDrag();

    if (!memo || !catId) return;

    suppressClick = true;
    setTimeout(function () { suppressClick = false; }, 400);

    moveMemo(memo.id, catId);
  }

  function bindDrag(el, memo) {
    el.addEventListener('pointerdown', function (e) {
      if (e.pointerType === 'mouse' && e.button !== 0) return;
      if (dragState) return;

      var startX = e.clientX;
      var startY = e.clientY;
      var timer = null;
      var armed = true;
      var dragStarted = false;

      function onMove(ev) {
        if (!armed) return;

        if (!dragStarted) {
          var dx = Math.abs(ev.clientX - startX);
          var dy = Math.abs(ev.clientY - startY);
          if (dx > 8 || dy > 8) {
            armed = false;
            if (timer) { clearTimeout(timer); timer = null; }
            cleanup();
          }
          return;
        }

        updateGhost(ev.clientX, ev.clientY);
        updateHover(ev.clientX, ev.clientY);
      }

      function onUp(ev) {
        if (timer) { clearTimeout(timer); timer = null; }

        if (dragStarted) {
          finishDrag(ev.clientX, ev.clientY);
        }
        cleanup();
      }

      function cleanup() {
        window.removeEventListener('pointermove', onMove);
        window.removeEventListener('pointerup', onUp);
        window.removeEventListener('pointercancel', onUp);
      }

      timer = setTimeout(function () {
        timer = null;
        if (!armed || dragState) return;
        dragStarted = true;
        startDrag(el, memo, startX, startY);
      }, 450);

      window.addEventListener('pointermove', onMove);
      window.addEventListener('pointerup', onUp);
      window.addEventListener('pointercancel', onUp);
    });
  }

  function moveMemo(memoId, catId) {
    var memo = findMemo(memoId);
    if (!memo) return;
    if (memo.category === catId) return;

    memo.category = catId;
    saveStore();
    renderSidebar();
    renderGrid();
    highlightSidebar();
  }

  /* ============================================================
     ⑨ 添加备忘录 / 大分类
     ============================================================ */
  function addMemo(title, body) {
    var catId = activePanelName.indexOf('cat:') === 0
      ? activePanelName.slice(4)
      : null;

    var memo = {
      id: 'memo-' + Date.now(),
      title: title || '未命名备忘录',
      date: todayStr(),
      body: body || '',
      category: catId
    };

    MEMOS.unshift(memo);
    saveStore();
    renderSidebar();
    renderGrid();
    showDetail(memo.id);
  }

  function addCategory(name) {
    var cat = {
      id: 'cat-' + Date.now(),
      name: name || '新分类'
    };
    CATEGORIES.push(cat);
    saveStore();
    renderSidebar();
    renderGrid();
  }

  /* ============================================================
     ⑩ 弹窗
     ============================================================ */
  var modalMode = 'memo';

  function openModal(mode) {
    modalMode = mode;

    if (mode === 'memo') {
      modalTitle.textContent = '新建备忘录';
      modalNameLabel.textContent = '标题';
      modalNameInput.value = '';
      modalNameInput.placeholder = '给备忘录起个标题';
      modalBodyField.style.display = '';
      modalBodyInput.value = '';
    } else {
      modalTitle.textContent = '新建大分类';
      modalNameLabel.textContent = '名称';
      modalNameInput.value = '';
      modalNameInput.placeholder = '比如：工作、生活、灵感';
      modalBodyField.style.display = 'none';
      modalBodyInput.value = '';
    }

    modalBackdrop.classList.add('open');
    modalBackdrop.setAttribute('aria-hidden', 'false');
    setTimeout(function () { modalNameInput.focus(); }, 60);
  }

  function closeModal() {
    modalBackdrop.classList.remove('open');
    modalBackdrop.setAttribute('aria-hidden', 'true');
  }

  modalCancel.addEventListener('click', closeModal);

  modalBackdrop.addEventListener('click', function (e) {
    if (e.target === modalBackdrop) closeModal();
  });

  modalConfirm.addEventListener('click', function () {
    var name = modalNameInput.value.trim();
    if (!name) { modalNameInput.focus(); return; }

    if (modalMode === 'memo') {
      addMemo(name, modalBodyInput.value);
    } else {
      addCategory(name);
    }
    closeModal();
  });

  modalNameInput.addEventListener('keydown', function (e) {
    if (e.key === 'Enter') {
      e.preventDefault();
      modalConfirm.click();
    }
  });

  document.addEventListener('keydown', function (e) {
    if (!modalBackdrop.classList.contains('open')) return;
    if (e.key === 'Escape') closeModal();
  });

  /* ============================================================
     ⑪ 主题
     ============================================================ */
  var root = document.documentElement;
  var THEMES = ['reset', 'reset-dark', 'navy', 'navy-dark'];
  var THEME_PAIR = {
    'reset': 'reset-dark',
    'reset-dark': 'reset',
    'navy': 'navy-dark',
    'navy-dark': 'navy'
  };

  function applyTheme(theme) {
    if (THEMES.indexOf(theme) === -1) theme = 'reset';
    var dark = /-dark$/.test(theme);

    root.setAttribute('data-theme', theme);
    themeBtn.setAttribute('aria-pressed', String(dark));
    themeText.textContent = dark ? '浅色模式' : '深色模式';
    themeIcon.textContent = dark ? '☀' : '☾';
    if (themeSelect) themeSelect.value = theme;

    if (meta) {
      var bg = getComputedStyle(root).getPropertyValue('--pageBg').trim();
      if (bg) meta.setAttribute('content', bg);
    }

    try { localStorage.setItem('swfb-theme', theme); } catch (e) {}
  }

  var savedTheme = null;
  try { savedTheme = localStorage.getItem('swfb-theme'); } catch (e) {}
  applyTheme(savedTheme && THEMES.indexOf(savedTheme) !== -1 ? savedTheme : 'reset');

  themeSelect.addEventListener('change', function () {
    applyTheme(themeSelect.value);
  });

  themeBtn.addEventListener('click', function () {
    var cur = root.getAttribute('data-theme');
    applyTheme(THEME_PAIR[cur] || 'reset');
  });

  /* ============================================================
     ⑫ 侧栏折叠
     ============================================================ */
  var isNarrow = window.matchMedia('(max-width: 860px)');

  function syncBackdrop() {
    if (!backdrop) return;
    var collapsed = sidebar.getAttribute('data-collapsed') === 'true';
    backdrop.classList.toggle('visible', isNarrow.matches && !collapsed);
  }

  function applySidebar(collapsed) {
    sidebar.setAttribute('data-collapsed', collapsed ? 'true' : 'false');
    brandBtn.setAttribute('aria-expanded', String(!collapsed));
    brandBtn.setAttribute('aria-label', collapsed ? '展开侧栏' : '收起侧栏');
    brandBtn.title = collapsed ? '展开侧栏' : '收起侧栏';
    syncBackdrop();
  }

  var savedSb = null;
  try { savedSb = localStorage.getItem(SB_KEY); } catch (e) {}

  if (isNarrow.matches) {
    applySidebar(savedSb === null ? true : savedSb === 'true');
  } else {
    applySidebar(savedSb === 'true');
  }

  brandBtn.addEventListener('click', function () {
    var next = sidebar.getAttribute('data-collapsed') !== 'true';
    applySidebar(next);
    try { localStorage.setItem(SB_KEY, String(next)); } catch (e) {}
  });

  if (backdrop) {
    backdrop.addEventListener('click', function () {
      applySidebar(true);
      try { localStorage.setItem(SB_KEY, 'true'); } catch (e) {}
    });
  }

  if (isNarrow.addEventListener) isNarrow.addEventListener('change', syncBackdrop);
  else if (isNarrow.addListener) isNarrow.addListener(syncBackdrop);
  window.addEventListener('resize', syncBackdrop);

  /* ============================================================
     ⑬ 新增按钮
     ============================================================ */
  fabAdd.addEventListener('click', function () {
    openModal('memo');
  });

  addCategoryBtn.addEventListener('click', function (e) {
    e.preventDefault();
    e.stopPropagation();
    openModal('category');
  });

  addCategoryBtn.addEventListener('keydown', function (e) {
    if (e.key === 'Enter' || e.key === ' ') {
      e.preventDefault();
      e.stopPropagation();
      openModal('category');
    }
  });

  /* ============================================================
     ⑭ 启动
     ============================================================ */
  renderSidebar();
  renderGrid();
  showList();

})();
</script>

</body>
</html>
